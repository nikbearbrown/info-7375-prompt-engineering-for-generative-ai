r people who have been inside organizations when change was hard, who speak the language of a CFO, and who already use AI the way surgeons use instruments: not occasionally, not as an experiment, but as the default way they work. You'll own a book of ~45 mid-market customers, responsible for driving genuine workflow transformation — not just onboarding completion\n\n\n\nWhat You'll do \n\n 1. Lead mid-market customers through the full transformation journey — from implementation through agentic workflow adoption — with clear accountability for time-to-value and measurable business outcomes\n\n 2. Build and own the change management strategy for each account: map stakeholders, diagnose resistance, build internal coalitions, and drive adoption past the finish line\n\n 3. Quantify and communicate Ramp's impact in the language CFOs and Controllers care about — close cycle improvement, spend visibility, variance reduction, and ROI — not just product usage metric\n\n 4. Run stakeholder management across multiple layers of a customer org, including finance leadership relationships you own independently\n\n 5. Use AI tools daily to prepare for customer calls, build materials, synthesize data, identify account risk, and operate at a pace traditional methods can't match\n\n 6. Help customers understand and adopt Ramp's agentic finance capabilities — positioning new workflows not as features, but as fundamental changes to how their finance team operates\n\n 7. Partner with Account Executives and Technical Consulting to deliver seamless implementations and expand Ramp's footprint within accounts\n\n 8. Bring customer insight back to Product — surfacing patterns, gaps, and opportunities from your accounts to shape how Ramp evolves\n\n\n\nWhat You'll Need\n\n - 5+ years of customer-facing experience in customer success, consulting, or implementations with a proven, consistent track record of driving customer outcomes and exceeding goals\n\n - Demonstrated ability to drive workflow adoption inside organizations, navigate real resistance from real stakeholders, and produce measurable results; finance or fintech context is a plus but not required\n\n - AI fluency as a daily habit — you already use AI tools habitually to prep for calls, synthesize information, build customer-facing materials, and automate repetitive tasks; this is how you work, not something you're exploring\n\n - Ability to communicate Ramp's impact in financial terms — walking a controller through the business case for a workflow change, connecting implementation milestones to P&L outcomes, and running executive updates that land with finance leaders\n\n - Technical acumen to hold your own in conversations with Product and Engineering on integrations, APIs, and workflow architecture; credibility in technical conversations earns you a seat at the table with the full customer stakeholder group\n\n - Prior demonstrated success in fast-paced, results-oriented GTM environments, ideally at SaaS or FinTech companies\n\n - Strong collaboration and influencing skills across Sales, Product, Operations, and other GTM teams\n\n\n\nNice to Haves\n\n 1. Experience helping customers adopt AI-powered or agentic workflows at scale; understanding of what friction looks like in practice and what makes transformation stick\n\n 2. Exposure to FP&A, accounting software ecosystems (NetSuite, Sage, QuickBooks, Xero), expense management, or CFO-adjacent workflows\n\n 3. Demonstrated commercial impact — expansion, retention, or time-to-value outcomes with specific metrics attached\n\n 4. Background at an AI-first or AI transformation company where rethinking workflows around AI was part of the product or culture\n\n 5. Management consulting background with structured problem-solving, client management, and the ability to turn ambiguity into a plan\n\n 6. High-growth or startup experience with comfort operating in ambiguity and rapid change\n\n\n\nFor candidates located in NYC or SF, the pay range for this role is $128,000 - $176,000. For candidates located in all other locations, the pay range for this role is $115,000- $158,300.\n\n\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disabi", "truncated": true, "no_body": false}, {"id": "lever:204f6cd7-98a3-4360-87e3-8876adf087da", "board": "lever:spotify", "title": "Senior Data Engineer - Data Platform", "location": "London", "family": "Platform", "url": "https://jobs.lever.co/spotify/204f6cd7-98a3-4360-87e3-8876adf087da", "body": "The Platform team creates the technology that enables Spotify to learn quickly and scale easily, enabling rapid growth in our users and our business around the globe. Spanning many disciplines, we work to make the business work; creating the infrastructure, tooling, frameworks, and capabilities needed to welcome a billion customers.\nThe Data Platform team develops and maintains the infrastructure that supports Spotify’s data ecosystem. Within Data Platform, the Data Collection product area builds infrastructure that makes it easier to collect and consume data at scale. You’ll join a team focused on making user behaviour data seamless and reliable for data teams across Spotify.\n\nSpotify is an equal opportunity employer. You are welcome at Spotify for who you are, no matter where you come from, what you look like, or what’s playing in your headphones. Our platform is for everyone, and so is our workplace. The more voices we have represented and amplified in our business, the more we will all thrive, contribute, and be forward-thinking! So bring us your personal experience, your perspectives, and your background. It’s in our differences that we will find the power to keep revolutionizing the way the world listens.\n \nAt Spotify, we are passionate about inclusivity and making sure our entire recruitment process is accessible to everyone. We have ways to request reasonable accommodations during the interview process and help assist in what you need. If you need accommodations at any stage of the application or interview process, please let us know - we’re here to support you in any way we can.\n\nWhat You'll Do\nCollaborate with product and engineering teams to build and support critical data infrastructure and datasets. \n Build systems that collect and process user behaviour data at scale. \n Help power Spotify’s personalization and recommendation systems, as well as the tools teams use to build and test new features. \n Design and evolve data architectures that support high data volumes and a broad range of internal users. \n Improve the reliability, scalability, and usability of our data infrastructure. \n Work across disciplines to solve complex data challenges and make an impact across Spotify.\n\nWho You Are\nYou are an experienced Data Engineer, and proficient in backend development using Java. \n You are comfortable working with large-scale datasets using SQL and platforms such as BigQuery. \n You have experience with JVM-based data processing frameworks such as Flink, Beam, Dataflow, or Spark. \n You are familiar with DevOps practices, cloud infrastructure, containerized applications, and Kubernetes fundamentals. \n You have experience with data modeling and schema design. \n You care about high-quality code and engineering practices such as continuous delivery and automated testing. \n You value experimentation, iterative development, and collaborative software development practices. \n You are comfortable navigating ambiguity and open-ended problems, using data and sound judgment to make decisions.\n\nWhere You'll Be\nThis role is based in London \n We offer you the flexibility to work where you work best! There will be some in person meetings, but still allows for flexibility to work from home.", "truncated": false, "no_body": false}, {"id": "greenhouse:8203478", "board": "greenhouse:reddit", "title": "Staff Machine Learning Engineer, AI Security", "location": "Remote - United States", "family": "Machine Learning", "url": "https://job-boards.greenhouse.io/reddit/jobs/8203478", "body": "", "truncated": false, "no_body": true}, {"id": "ashby:50770187-f226-468a-823e-fe193287c59f", "board": "ashby:ramp", "title": "KYB/AML Analyst, Sweden", "location": "Remote (Sweden)", "family": "Compliance", "url": "https://jobs.ashbyhq.com/ramp/50770187-f226-468a-823e-fe193287c59f", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE \n\nRamp is launching payments across the EU through its Swedish payment institution. Our European operations team (Europs) onboards European businesses and keeps them trading, across Ramp's own regulated entities and our card-issuing and payments partners. We're a small team that runs on frontier AI tooling: our operators build and use their own automations so they can spend their time on judgement, not admin. We're hiring a KYB/AML Analyst in Stockholm to review and onboard business customers of our Swedish entity, work directly with those customers to get them live, and resolve onboarding requirements raised by our partners. You'll join a small Swedish team and help keep onboarding moving every day as we grow.\n\n\n\n\nWHAT YOU'LL DO\n\n - Carry out first-line (1LoD) KYB reviews of business customers onboarding with Ramp's Swedish payment institution: company verification, beneficial ownership, sanctions/PEP/adverse-media screening, and risk assessment\n\n - Decide standard cases end to end, and escalate complex or higher-risk cases with a clear rationale\n\n - Handle customer communications through onboarding: clear document requests, follow-ups and status updates\n\n - Resolve onboarding requirements from our card-issuing and payments partners for EU customers\n\n - Document decisions to a standard that holds up to second-line and regulatory review\n\n - Keep Swedish casework moving when teammates are on leave or handling incidents\n\n - Spend part of your time improving how we work: playbooks, templates and AI-assisted workflows\n\n\n\n\nWHAT YOU NEED\n\n - 2–4 years of KYB / AML / onboarding experience at a fintech, payment institution, EMI or bank\n\n - Solid grounding in business customer due diligence: company registers, UBO identification, sanctions/PEP screening, and spotting red flags\n\n - Fluent English, written and verbal\n\n - Clear, friendly written communication with customers\n\n - Curiosity about AI tools and how they can make casework faster and better\n\n - Based in, or relocating to, Stockholm, with the right to work in Sweden\n\n\n\n\nNICE-TO-HAVES\n\n - Swedish (strongly preferred)\n\n - Familiarity with Swedish sources and requirements (Bolagsverket, the beneficial ownership register, FI expectations under the Swedish AML Act)\n\n - Experience onboarding EU businesses across several jurisdictions\n\n - An additional European language\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n \n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n \n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice", "truncated": false, "no_body": false}, {"id": "ashby:4859cd5e-f2a9-44d7-81f7-8bfc0e62369f", "board": "ashby:ramp", "title": "Software Engineer, iOS", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/4859cd5e-f2a9-44d7-81f7-8bfc0e62369f", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE\n\nAs an iOS Engineer at Ramp, you’ll enhance our successful and rapidly growing mobile app. You will improve the core platform that thousands of businesses rely on while also building the future of automated finance by integrating AI and intelligent agents into the mobile experience. This is a chance to grow your skills on a proven product and define the next generation of fintech.\n\n\nCheck out our Engineering Blog https://engineering.ramp.com/ for more on our tech stack, mission, and values!\n\n\n\n\nWHAT YOU’LL DO\n\n - Design, build, and launch new products to Ramp’s iOS app.\n\n - Help establish engineering processes, tools, and systems that allow us to scale the code base and productivity.\n\n - Conduct code reviews and set engineering standards.\n\n - Work with Product and Design to identify key features that will make the app successful.\n\n - Work alongside Product and other cross-functional teams to understand customer feedback and continuously improve our product.\n\n\n\n\nWHAT YOU NEED\n\n - Minimum 1 year of experience in mobile development.\n\n - Proficiency in Swift and SwiftUI for iOS development.\n\n - Experience launching at least one mobile app and/or several features that reached a large number of users.\n\n - Desire to work in a fast-paced environment, continuously grow, and master your craft.\n\n - Strong understanding of mobile design patterns and best practices.\n\n\n\n\nNICE TO HAVES\n\n - Experience with web apps (React, TypeScript).\n\n - Experience with backend technologies (Python, Flask, SQL, OpenAPI).\n\n - Experience with our mobile stack in addition to Swift and SwiftUI: Swift Concurrency, The Composable Architecture, Bazel, OpenAPI & Buildkite\n\n - Experience managing apps with App Store Connect\n\n\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n \n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n \n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice", "truncated": false, "no_body": false}, {"id": "ashby:939892e5-5273-4bfc-8c41-a6c51cabb228", "board": "ashby:ramp", "title": "Software Engineer, Backend, Comms Platform", "location": "Remote (US)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/939892e5-5273-4bfc-8c41-a6c51cabb228", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE\n\nEvery approval request, receipt reminder, payment alert, and card notification Ramp sends has to reach the right person, on the right channel, at the right time. When it does, finance teams close faster and employees spend less time chasing tasks. When it doesn't, a missed message can mean a stalled approval, a late payment, or a flood of notifications nobody asked for.\n\n\n\nRamp's Communications Platform team builds the shared system that every product team uses to reach customers. It handles transactional messages across email, SMS, push, Slack, Microsoft Teams, and WhatsApp, including templating, delivery, retries, digesting, user preferences, and delivery monitoring. The team also supports the conversational experiences that let customers work with Ramp directly from the channels they already use.\n\n\n\nWe're looking for a backend engineer to own a core part of that platform. You'll take responsibility for an area such as message delivery and channel integrations, communication preferences, or platform reliability and scale, set its technical direction within the team, and keep it correct and dependable as message volume and the number of teams building on it grow. You'll work closely with product, design, and engineering partners across Ramp to make communications faster, more reliable, and easier for every team to build on.\n\n\n\n\nWHAT YOU'LL DO\n\n - Own the design and evolution of a core part of Ramp's communications platform, from technical design through launch, monitoring, and iteration\n\n - Build and extend integrations with messaging channels and delivery providers, including email, SMS, push, and workplace chat tools such as Slack and Microsoft Teams\n\n - Design delivery workflows that are idempotent, retry safely, and confirm successful delivery, so customers reliably get the messages they need without duplicate sends\n\n - Build communication preferences and controls that let users and administrators decide what they receive and where\n\n - Make the platform simple and safe for other Ramp engineers to build on, with clear abstractions, strong defaults, and good developer tooling\n\n - Improve the reliability, performance, and observability of the platform as message volume grows\n\n - Drive technical direction for your area and raise the engineering bar through design reviews, code reviews, and mentorship\n   \n   \n\n\nWHAT YOU'LL NEED\n\n - Experience designing, building, and operating production backend systems, including APIs, data models, and asynchronous workflows\n\n - A track record of owning a system or product area end to end and shaping its technical direction over time\n\n - Strong system design judgment, especially around reliability, idempotency, and correctness in high-volume distributed systems\n\n - Product sense: you care about the experience of the people receiving each message, not just the ticket, and you balance speed with quality\n\n - Clear communication and a collaborative approach to technical decisions across product, design, and engineering\n   \n   \n\n\nNICE TO HAVES\n\n - Experience building notification, messaging, or communications platforms\n\n - Experience integrating with messaging providers or channel APIs, such as Twilio, SendGrid, Slack, Microsoft Teams, or WhatsApp\n\n - Experience building internal platforms or shared services used by many engineering teams\n\n - Experience scaling high-volume, event-driven, or queue-based systems\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursua", "truncated": true, "no_body": false}, {"id": "ashby:606475af-b74f-42c4-978a-dde138a86ac7", "board": "ashby:ramp", "title": "Associate, Strategic Finance", "location": "New York, NY (HQ)", "family": "Finance", "url": "https://jobs.ashbyhq.com/ramp/606475af-b74f-42c4-978a-dde138a86ac7", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE \n\nRamp's Strategic Finance team sits at the center of how the company allocates its time and resources. We're hiring across three complementary tracks — and looking for people with sharp financial instincts, a builder's mindset, and the drive to take on a large scope quickly. Whether you lean toward GTM strategy, FP&A infrastructure, or broad strategic partnership, this is a uncated": false, "no_body": false}, {"id": "lever:9899871a-4307-4367-9f74-039569d7a650", "board": "lever:spotify", "title": "Full Stack Engineer - Music", "location": "New York, NY", "family": "Music", "url": "https://jobs.lever.co/spotify/9899871a-4307-4367-9f74-039569d7a650", "body": "Music Expression builds the tools artists use to show who they are on Spotify and to connect with fans. A song doesn't have to be just a track in a list. On Spotify it can come with a looping Canvas visual, a music video, a vertical-video clip from the artist, or a countdown to a new release. Release day can become a shared Listening Party. Every one of those things was built by this org. Each squad owns part of the artist-to-fan journey.\nThe work runs from video pipelines and serving infrastructure through mobile and web clients to rights systems, so engineers get real depth and range. Product, design, data science, research and product marketing work inside the squads, and they work directly with artists and labels. What you ship changes how artists show up on Spotify and how fans experience their music. If you want to work where technology meets creativity and culture, this is the place.\nIf this role excites you but you don't meet every requirement, we'd still love to hear from you. We welcome candidates from all backgrounds.\n\nThe United States base range for this position is $132,948 - $189,927 plus equity. The benefits available for this position include health insurance, six month paid parental leave, 401(k) retirement plan, monthly meal allowance, 23 paid days off, 13 paid flexible holidays. This range encompasses multiple levels. Leveling is determined during the interview process. Placement in a level depends on relevant work history and interview performance. These ranges may be modified in the future.\n\n\nSpotify is an equal opportunity employer. You are welcome at Spotify for who you are, no matter where you come from, what you look like, or what’s playing in your headphones. Our platform is for everyone, and so is our workplace. The more voices we have represented and amplified in our business, the more we will all thrive, contribute, and be forward-thinking! So bring us your personal experience, your perspectives, and your background. It’s in our differences that we will find the power to keep revolutionizing the way the world listens.\n \nAt Spotify, we are passionate about inclusivity and making sure our entire recruitment process is accessible to everyone. We have ways to request reasonable accommodations during the interview process and help assist in what you need. If you need accommodations at any stage of the application or interview process, please let us know - we’re here to support you in any way we can.\n\nWhat You'll Do\nDesign, build and maintain scalable backend services (Java) \n \n \n Be an active part of creating and evolving APIs and services that connect user experiences with internal scalable infrastructure, while applying product requirements \n \n \n Drive improvements to system architecture, performance, and developer experience \n \n \n Develop and enhance our user-facing layer and frontend SDKs (React/Typescript) \n \n \n Collaborate closely with a talented group of engineers, product managers, designers and data specialists across multiple teams \n \n \n Contribute to technical discussions and help shape platform decisions\n\nWho You Are\nYou are experienced in designing and developing backend applications in Java. \n \n \n You have a solid understanding of React, and TypeScript and are passionate about delivering end-to-end experiences and software architecture across the back-end, front-end, and the APIs that glue them together. \n \n \n You have a growth mindset, are curious, and are not afraid to be experimental. You share your ideas and continuously improve yourself and the team around you. \n \n \n Experience with infrastructure-related technologies is a plus. \n \n \n You care about agile software development and a culture of constant learning and improvement. \n \n \n You have excellent analytical and problem-solving skills and can communicate your ideas. \n \n \n You have experience and passion for mentoring and encouraging collaborative teams.\n\nWhere You'll Be\nWe offer you the flexibility to work where you work best! For this role, you can be within the ET time zone as long as we have a work location.", "truncated": false, "no_body": false}, {"id": "greenhouse:8263374", "board": "greenhouse:reddit", "title": "Senior iOS Software Engineer, Consumer Engineering", "location": "San Francisco, CA", "family": "Software Engineering", "url": "https://job-boards.greenhouse.io/reddit/jobs/8263374", "body": "", "truncated": false, "no_body": true}, {"id": "ashby:8fa367de-71ba-409e-befd-175a163acb1b", "board": "ashby:ramp", "title": "Software Engineer, Fraud & Identity", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/8fa367de-71ba-409e-befd-175a163acb1b", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\nAbout the Role\n\nWe are hiring a Software Engineer to build systems across Fraud, UIM (User & Identity Management), and Identity. This role sits at the intersection of security, risk decisioning, and product experience. You will help build detection and enforcement capabilities for fraud and account takeover, as well as the identity primitives that power authentication, authorization, and safe account access.\n\nThis work is deeply cross-functional. You will partner closely with Fraud Ops, Risk Strategy, Security, Product, and Data to ship improvements that are measurable in loss reduction, attack containment, and user experience.\n\n\nWHAT YOU’LL DO\n\n - Build and evolve backend services that detect and prevent fraud across multiple surfaces, including account access and money movement.\n\n - Develop enforcement and response tooling that enables fast, safe actions such as identity locks, business locks, payment freezes, and other containment levers.\n\n - Improve protections against account takeover (ATO), including risk-based step-ups, monitoring, and targeted friction controls (for example “under attack” style controls and MFA surge detection/alerting).\n\n - Design and operate high-signal systems with strong observability: metrics, dashboards, alerting, and playbooks for incidents and fraud campaigns.\n\n - Partner with UIM/Identity stakeholders to strengthen authentication and identity foundations (roles, permissions, identity state, and related platform primitives).\n\n - Drive end-to-end delivery: technical design, implementation, rollout strategy, and iteration based on outcome metrics.\n\n\nWHAT YOU’LL NEED\n\n - 3+ years of software engineering experience (or equivalent).\n\n - Strong backend engineering fundamentals (APIs, distributed systems, data modeling, reliability).\n\n - Experience building data-informed detection or decisioning systems (rules engines, scoring, anomaly detection, or similar), or strong interest in learning in this domain.\n\n - Proven ability to operate production systems: debugging, incident response, and improving on-call quality through instrumentation and automation.\n\n - Strong cross-functional communication skills and comfort working with product and operations partners.\n\nNice to Have\n\n - Experience in fraud, risk, identity, authentication, authorization, abuse prevention, or security engineering.\n\n - Familiarity with payments rails, card transaction risk, or account security patterns.\n\n - Experience building internal tools for operations teams (case management, investigation, enforcement workflows).\n\n\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n \n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n \n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice", "truncated": false, "no_body": false}, {"id": "ashby:47a75895-24af-49b7-9858-1be0ec0e7c71", "board": "ashby:ramp", "title": "Software Engineer, Backend, Accounts Receivable", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/47a75895-24af-49b7-9858-1be0ec0e7c71", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE\n\nGetting paid is still one of the most manual parts of running a business. Finance teams chase invoices over email, match payments to invoices by hand in spreadsheets, and close the books late because cash data is scattered across banks, payment processors, and ERPs.\n\nRamp's Accounts Receivable team is building the system that automates all of it, from the moment an invoice is sent to the moment cash is reconciled in the general ledger. We own the full receivables lifecycle: invoicing, collections, payments, cash application, and accounting sync.\n\nWe're looking for a senior backend engineer to own core pieces of that system. The work sits where hard engineering problems meet real money: matching messy payment data to the right invoices, keeping ledgers correct to the cent, and syncing reliably with the accounting systems our customers depend on. You'll own projects end to end, from design through production, and work closely with product and design to turn complex finance workflows into software that just works.\n\n\n\nWHAT YOU’LL DO\n\n - Build the payment-matching systems that automatically apply incoming ACH, wire, card, and check payments to the right invoices, even when payment details are incomplete or inconsistent\n\n - Design accurate data models where every dollar is traceable from invoice to payment to general ledger\n\n - Build two-way integrations with ERPs like NetSuite and QuickBooks that stay consistent through retries, partial failures, and edits on either side\n\n - Build collections workflows that help businesses get paid faster without hurting their customer relationships\n\n - Own projects from problem definition and technical design through launch, monitoring, and iteration\n\n - Raise the engineering bar through design reviews, code reviews, and mentorship\n   \n\n\nWHAT YOU’LL NEED\n\n - Product sense: you care about the customer problem, not just the ticket, and you push back when the spec is wrong\n\n - Experience designing and operating production backend systems, including APIs, data models, and asynchronous workflows\n\n - Strong system design judgment and the ability to balance speed, correctness, reliability, and simplicity\n\n - A track record of independently owning complex projects and shipping high-quality software\n\n - Strong communication skills and a collaborative approach to technical decisions\n   \n\n\nNICE TO HAVES\n\n - Experience with invoicing, billing, payments, accounting, or other financial workflows\n\n - Experience building integrations that keep data consistent across systems\n\n - Experience improving reliability and operational visibility in a growing product\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n \n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n \n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice", "truncated": false, "no_body": false}, {"id": "ashby:198150d6-789a-4ef8-999f-93a49656d4f1", "board": "ashby:ramp", "title": "Software Engineer, Engineering Platform", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/198150d6-789a-4ef8-999f-93a49656d4f1", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\nAbout the Role\n\nThe Engineering Platform team helps 300+ Ramp engineers move faster without breaking things. We work across the full software development lifecycle, including local development, CI/CD, testing, service frameworks, reliability, architecture, performance, and maintenance.\n\nPlatform engineers on this team do not wait for a roadmap to be handed to them. They find high-leverage problems, validate them with engineers and data, ship solutions, and iterate until those solutions are trusted, adopted, and durable.\n\nAgentic development has expanded our mission. We are building the systems that let engineers and AI agents work together effectively in Ramp’s large, complex codebases: clear abstractions, orchestration, reliable workflows, fast feedback loops, and strong guardrails are now even more important. These platform investments unlock agentic workflows that can plan, execute, test, review, and ship meaningful changes, helping every engineer and agent at Ramp maximize their impact.\n\nWhat You'll Do\n\n - Improve Ramp’s development workflows across CI/CD, testing, local development, code review, deploys, and remote environments.\n\n - Design paved paths for high-frequency engineering tasks, including service creation, migrations, reliable background jobs, and safe production changes.\n\n - Help Ramp’s codebase and infrastructure scale by improving modularity, performance, reliability, and maintainability across our Python monolith, internal libraries, and database systems.\n\n - Identify repetitive or error-prone engineering workflows, then build automation that helps engineers and AI agents complete them faster, more consistently, and more safely.\n\n - Turn recurring sources of friction or risk into reusable systems, workflows, and defaults that teams actually adopt.\n\nWhat We're Looking For\n\n - You think in systems across code, infrastructure, workflows, reliability, performance, and people.\n\n - You have built and led improvements to systems that make other engineers more effective, including developer tooling, CI/CD, test infrastructure, service frameworks, or large-scale codebase architecture.\n\n - You are comfortable with ambiguity and ownership. You can identify problems, align stakeholders, make tradeoffs, ship useful solutions, and iterate. You dive into whatever part of the tech stack or process is necessary to solve problems.\n\n - You understand that speed and quality go hand in hand: the best platforms make safe, high-quality engineering feel faster, not slower.\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n \n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n \n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice", "truncated": false, "no_body": false}, {"id": "lever:ee45924c-894c-4ea0-9c93-c5221894063f", "board": "lever:spotify", "title": "Senior Product Manager - User Platform", "location": "London", "family": "Platform", "url": "https://jobs.lever.co/spotify/ee45924c-894c-4ea0-9c93-c5221894063f", "body": "The Platform team creates the technology that enables Spotify to learn quickly and scale easily, enabling rapid growth in our users and our business around the globe. Spanning many disciplines, we work to make the business work; creating the infrastructure, tooling, frameworks, and capabilities needed to welcome a billion customers.\n\nUser Platform builds the identity and access capabilities that help people use Spotify safely and easily. We’re looking for a Senior Product Manager to shape how people access Spotify and stay connected across our apps, devices, and strategic partner integrations. You’ll focus on session management - how Spotify recognizes someone after they sign in, maintains their access, and enables them to connect or disconnect devices and applications.\n\nYou’ll bring together consumer experience and technical product strategy, working closely with engineering, design, research, insights, security, and teams responsible for Spotify’s clients and partnerships. Your decisions will help people get to the experiences they want, stay in control of their access, and use Spotify with confidence.\n\nSpotify is an equal opportunity employer. You are welcome at Spotify for who you are, no matter where you come from, what you look like, or what’s playing in your headphones. Our platform is for everyone, and so is our workplace. The more voices we have represented and amplified in our business, the more we will all thrive, contribute, and be forward-thinking! So bring us your personal experience, your perspectives, and your background. It’s in our differences that we will find the power to keep revolutionizing the way the world listens.\n\nAt Spotify, we are passionate about inclusivity and making sure our entire recruitment process is accessible to everyone. We have ways to request reasonable accommodations during the interview process and help assist in what you need. If you need accommodations at any stage of the application or interview process, please let us know - we’re here to support you in any way we can.\n\nSpotify transformed music listening forever when we launched in 2008. Our mission is to unlock the potential of human creativity by giving a million creative artists the opportunity to live off their art and billions of fans the chance to enjoy and be passionate about these creators. Everything we do is driven by our love for music and podcasting. Today, we are the world’s most popular audio streaming subscription service.\n\nWhat You'll Do\nDefine the product vision, strategy, and roadmap for session management across Spotify’s clients, device types, and strategic partner integrations. \n Use research, data, and feedback from users and developers to identify access friction and prioritize improvements with the greatest potential impact. \n Improve how sessions are established, maintained, and ended, balancing reliable access with account protection, privacy, and user control. \n Shape device connection, session transfer, and partner authorization experiences, including clear consent when an app requests access or additional capabilities. \n Partner with engineering to make session and access capabilities reusable and easier to adopt through APIs, client components, documentation, and clear integration guidance. \n Work across client, device, and partner teams to understand different needs, align priorities, and carry improvements through delivery and adoption. \n Define success measures for access quality, user friction, developer experience, and adoption, connecting those measures to meaningful user and business outcomes. \n Make thoughtful trade-offs between immediate experience improvements, long-term technical investment, security, and privacy while providing teams with clear direction and context.\n\nWho You Are\nYou have several years of product management experience and can demonstrate how products you’ve shipped improved outcomes for users or developers. \n You have experience working on consumer products, identity and access, connected devices, developer products, or partner integrations. \n You understand how technical capabilities such as session management, authorization, APIs, client behavior, or consent flows can shape the end-user and developer experience. \n You have strong product and user experience judgment and enjoy working with design, research, and engineering to make complicated interactions easier to understand and use. \n You can reason through technical trade-offs with engineers and translate complex product and technical decisions into clear language for different audiences. \n You use research and data to test assumptions, measure impact, and make sound decisions when evidence is incomplete. \n You have led work across teams with different priorities and can build productive relationships with technical and business partners. \n You can turn an ambiguous problem into a clear strategy, make difficult prioritization decisions, follow through on delivery, and contribute to an inclusive and collaborative product community.\n\nWhere You'll Be\nThis role is based in London or Stockholm \n We offer you the flexibility to work where you work best! There will be some in person meetings, but still allows for flexibility to work from home.", "truncated": false, "no_body": false}, {"id": "ashby:5598f7b8-4ae2-4105-a2b4-2d0f55c54c40", "board": "ashby:ramp", "title": "Software Engineer, Backend, Credit", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/5598f7b8-4ae2-4105-a2b4-2d0f55c54c40", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE\n\nThe Credit Engineering team builds the systems that enable Ramp to manage credit lifecycles for businesses end-to-end, from initial underwriting through ongoing portfolio strategy optimization. As an engineer on Credit, you’ll own systems that influence $100+ billion in annual payment volume through millions of decisions across our product stack in support of the most ambitious FinTech portfolio in the United States.\n\n\n\nWe are looking for a backend engineer to own the technical roadmap for underwriting, limit management, portfolio optimization, and agentic workflows. You will build robust systems, automate complex operational tasks, and maintain the high-frequency controls that power all of Ramp’s products. If you are obsessed with correctness, excited by ambiguity, and passionate about problems at the intersection of distributed systems and financial strategy, this role is for you.\n\n\n\n\nWHAT YOU'LL DO\n\n - Architect scalable, stateful systems for automated limit management to optimize Ramp’s charge card portfolio.\n\n - Envision and build the next generation of agents and tools that automate manual credit decisions and increase operational efficiency.\n\n - Develop high-volume, low-latency risk controls to support Ramp’s expansion into new products, customer segments, and geographies.\n\n - Design and build real-time decisioning systems spanning the entirety of a business's credit lifecycle on Ramp.\n\n - Partner closely with analysts, data scientists, and product to translate risk strategies into reliable software.\n\n\n\n\nWHAT YOU NEED\n\n - 2+ years of backend engineering experience.\n\n - Proficiency in Python or a comparable backend language.\n\n - Experience working with distributed systems and async frameworks.\n\n - Proficiency with converting abstract business problems into robust data models and technical specs.\n\n - Experience building or operating systems with strict auditability, observability, and correctness guarantees.\n\n - High ownership mentality – you care deeply about the systems you build.\n\n - Ability to work closely with non-engineering partners (Risk Strategy, Ops, Sales) to create impact.\n\n\n\n\n\nNICE TO HAVES\n\n - Experience leveraging AI/LLMs for development or for internal workflows.\n\n - Interest in financial optimization problems.\n\n - Willingness to learn and move fast while holding the bar on correctness.\n\n - Defensive programming aptitude.\n\n - Experience using feature stores, rule engines, and ML platforms in production.\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n \n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n \n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice", "truncated": false, "no_body": false}, {"id": "ashby:c21af93e-210f-4969-8eaa-90fb16a5b720", "board": "ashby:linear", "title": "Account Executive, Startups", "location": "North America", "family": "GTM", "url": "https://jobs.ashbyhq.com/linear/c21af93e-210f-4969-8eaa-90fb16a5b720", "body": "At Linear, we're building the product development system for teams and agents. AI is fundamentally changing how software gets built, and we’re shaping the tools this new era requires.\n\nFounded in 2019, Linear has become the platform of choice for more than 50,000 companies (including OpenAI, Coinbase, and Ramp) to plan, build, and ship their products. Today, our team is distributed across North America, Europe, and Australia, and we’re continuing to grow internationally. What unites us is relentless focus, fast execution, and a deep care for software craftsmanship.\n\nOver the past few years, Linear has experienced incredible organic growth and has become an instrumental tool for many of the world’s best product teams. We are now layering a product-led sales motion on top of our existing self-serve business to accelerate our ambitions further and bring the magic of Linear to even more and larger companies. As an Account Executive at Linear, you’ll contribute to the future of our product and help high-impact companies build better software.\n\nLocation & work mode\n\nLinear is a remote-first company, with optional co-working offices in San Francisco, New York, and London. This role is open to candidates based in North America. You can work from anywhere within this region. We value deep focus and async collaboration, with intentional moments to connect in person through team off-sites, optional co-working, and occasional travel.\n\nWhat you'll do\n\n - Become a product expert and help customers use Linear effectively; assist prospects through the trial and evaluation phase\n\n - Generate a strong pipeline and exceed quarterly targets\n\n - Build relationships with key stakeholders within accounts\n\n - Be the voice of the customer; advocate for customers by surfacing product or adoption blockers to our product team\n\nWhat we're looking for\n\n - 3+ years in a quota-carrying sales role\n\n - Experience selling to a technical audience; bonus if you have previous experience working with a collaboration or developer tool\n\n - SaaS and startup experience; comfortable working and adapting in a fast-paced and flexible environment\n\n - Strong written and verbal communication, presentation, and product demonstration skills\n\nWhat we offer\n\nWe're a small, focused team that cares deeply about the quality of our work and the people we do it with. Here's what you can expect:\n\n - Employee-friendly equity terms including early exercise in the US and extended exercise windows\n\n - Daily meal and coffee stipend on every workday\n\n - Paid co-working space or desk\n\n - Health coverage (based on country requirements)\n\n - 5 weeks paid vacation, plus local statutory holidays\n\n - 4 months paid parental leave\n\n - Paid month off after 4 years & every 2 years thereafter\n\n - Regular team events and off-sites\n\n - Remote-first with no required commute\n\nCompensation\n\nFor US-based candidates, the expected cash compensation range for this role is $191,000—$214,500. For sales roles, this range represents on-target earnings (OTE), including base salary and variable compensation; for all other roles, it represents base salary. Final compensation is determined based on job-related knowledge, skills, and experience. For sales roles, actual earnings vary based on sales performance. Equity is a meaningful part of all offers at Linear.\n\nLearn how we think and work\n\n - A story about our mission: Read Me https://linear.app/readme\n\n - Our hiring process: How we hire at Linear https://linear.app/now/how-we-hire-at-linear\n\n - Our CEO and co-founder, Karri at 20VC: How to Grow Capital Efficiently in a World of BS Growth https://www.youtube.com/watch?v=4vqDYkuzbSM\n\n - Make an Org Chart You Want to Ship — Advice from Linear on How Heirloom Tomatoes Should Inspire Team Design https://review.firstround.com/make-an-org-chart-you-want-to-ship-advice-from-linear-on-how-heirloom-tomatoes-should-inspire-team-design/\n\n - Building our teams: Why and how we do work trials at Linear https://linear.app/blog/why-and-how-we-do-work-trials-at-linear\n\n - A video series: Conversations on Quality https://linear.app/quality\n\n - Our recent tender offer: Sharing Linear’s growth with the people building it https://linear.app/now/sharing-growth-with-the-people-building-linear\n\nA note on recruitment fraud: all official Linear hiring communication comes from an @linear.app http://linear.app email address, and all open roles are listed at linear.app/careers http://linear.app/careers. We never ask candidates for payment or financial information. Suspicious messages can be reported to security@linear.app.\n\nLinear is an equal opportunity employer. We do not discriminate based on race, color, religion, gender identity or expression, sexual orientation, national origin, age, disability, veteran status, or any other protected characteristic under applicable law.", "truncated": false, "no_body": false}, {"id": "ashby:f0e3a8bb-5f86-4ce1-b345-80d8912f9ddc", "board": "ashby:ramp", "title": "Procurement Product Activation Manager", "location": "New York, NY (HQ)", "family": "Sales", "url": "https://jobs.ashbyhq.com/ramp/f0e3a8bb-5f86-4ce1-b345-80d8912f9ddc", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE TEAM & ROLE\n\nRamp's procurement product is changing how companies buy. We've built the fastest intake-to-pay platform on the market. 3x faster than traditional P2P workflows, with AI that automates sourcing, contract extraction, approval routing, and invoice matching in one place. Customers save an average of 16% on vendor spend annually and eliminate 46+ hours of manual purchasing work every month.\n\nAs a Procurement Product Activation Manager, you're the person who makes that real for our customers. You'll work directly with CFOs, controllers, and finance operations teams to design, configure, and launch Ramp's procurement product — helping them go from broken, manual buying processes to a streamlined system that their entire company actually uses.\n\nThis is not a \"follow the playbook\" implementation role. You'll be redesigning how companies buy things, which requires equal parts process consulting, product expertise, and relationship management.\n\n\n\n\n🎯 WHAT YOU'LL DO\n\n - Own procurement implementation for Commercial and upper Mid-Market accounts from close-won through go-live\n\n - Partner with CFOs, finance ops, IT, and legal stakeholders to map existing procurement workflows and design their future-state on Ramp through a change management process\n\n - When procurement and Bill Pay are both part of the deal, cover both — procurement is the priority, but you carry Bill Pay activation when it's bundled\n\n - Provide structured product feedback to Ramp's Engineering and Product teams based on what you see across implementations — this is a core part of the role\n\n - Partner with AEs and AMs when procurement configuration questions come up pre-close or during expansion\n\n\n🧠 WHAT YOU BRING\n\n - Real procurement depth: you've lived inside procure-to-pay — whether at a company managing purchasing or at a platform like Coupa, Zip, Procurify, Stampli, or Ivalua. PO creation, approval routing, invoice matching, and ERP sync aren't concepts you read about; they're things you've configured or managed.\n\n - Customer-facing confidence: you run structured discovery, manage calls with multiple decision-makers, and can guide a Controller or AP Manager through a configuration decision without losing their trust\n\n - Strong follow-through: multiple implementations running at once, nothing falls through, customers don't have to chase you\n\n - Moves fast independently: Ramp's product ships constantly. You don't wait for someone to brief you on a new feature — you find it, figure it out, and update your approach.\n\n - Sharp product instincts: you can tell the difference between a user error, a training gap, and a real product limitation — and you say so directly to Engineering and Product, not just \"the customer asked for X.\"\n\n\n🌟 NICE TO HAVE\n\n - Experience at a procurement software company in an implementation, solutions, or customer success role\n\n - Familiarity with NetSuite, QuickBooks, or other ERP systems and how they integrate with procurement tools\n\n - Consulting background or experience at a company where structured discovery was a core skill. You know how to lead a call and leave with clear requirements\n\n\n🏆 WHAT SUCCESS LOOKS LIKE\n\n - You're carrying 50–60 active implementations per quarter and customers are hitting go-live on schedule\n\n - Your CSM counterparts know what you're working on and why — handoffs are clean, nothing falls through the cracks between implementation and ongoing success\n\n - You've built or meaningfully improved at least one internal process — a playbook, a feedback loop with Product, a configuration template — that the team uses after you\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100", "truncated": true, "no_body": false}, {"id": "lever:8bd60a8c-d8bb-41ba-9ac0-69d0b643d63d", "board": "lever:spotify", "title": "Senior Product Manager - Spotify Connect", "location": "London", "family": "Experience", "url": "https://jobs.lever.co/spotify/8bd60a8c-d8bb-41ba-9ac0-69d0b643d63d", "body": "We design Spotify’s consumer experience—end to end, moment to moment, across every screen, platform, and partner integration. Our mission is to make listening feel effortless, personal, and joyful for billions of users around the world. That means turning complexity into clarity across hundreds of touchpoints—from our mobile and desktop apps to the smart speakers, TVs, cars, and integrations where Spotify shows up every day. If it touches a consumer, we shape it. We bring deep insight into human behavior, design, and technology to craft experiences that feel intuitive, expressive, and unmistakably Spotify.\nWe are looking for a Senior Product Manager to make Spotify easier to enjoy across the devices people use every day. You will work in Seamless within Platform & Partner Experience, focusing on Spotify Connect and the experiences that help people find, choose, and control where Spotify plays.\nYou will bring together user understanding, product judgment, and technical curiosity to make complex interactions feel effortless. From discovering the right device to keeping an experience consistent as people move through their day, you will help build products people can trust.\n\nSpotify is an equal opportunity employer. You are welcome at Spotify for who you are, no matter where you come from, what you look like, or what’s playing in your headphones. Our platform is for everyone, and so is our workplace. The more voices we have represented and amplified in our business, the more we will all thrive, contribute, and be forward-thinking! So bring us your personal experience, your perspectives, and your background. It’s in our differences that we will find the power to keep revolutionizing the way the world listens.\n \nAt Spotify, we are passionate about inclusivity and making sure our entire recruitment process is accessible to everyone. We have ways to request reasonable accommodations during the interview process and help assist in what you need. If you need accommodations at any stage of the application or interview process, please let us know - we’re here to support you in any way we can.\n\nWhat You'll Do\nOwn the product strategy and roadmap for your scope within Spotify Connect, turning the broader Seamless direction into clear priorities. \n Work with research and data colleagues to understand cross-device behavior, identify friction, and define measures of success. \n Partner with engineering and design to deliver intuitive and reliable experiences for discovering devices, controlling playback, and moving between them. \n Balance improvements to everyday usability and reliability with experiments that uncover new value. \n Work across teams and partner-facing functions to manage dependencies and deliver a coherent end-to-end experience. \n Explore opportunities created by richer device understanding and emerging ways of interacting with Spotify, keeping privacy, permissions, and user control central. \n Clearly communicate product choices, progress, and results, and use what you learn to improve the roadmap.\n\nWho You Are\nYou have experience owning and delivering high-quality consumer products, from identifying a problem through launch and iteration. \n You can translate user needs into clear priorities and sustain progress across multiple dependencies. \n You are comfortable working with technically complex products and can connect system behavior to the user experience. \n You can communicate and debate strategic and technical complexity with senior stakeholders. \n You use quantitative and qualitative evidence to make decisions and have experience designing and learning from experiments. \n You care about the details that make a product dependable and easy to use. \n You communicate clearly, collaborate well across disciplines, and are willing to work hands-on. \n You have experience with connected devices, playback, platform products, or cross-device experiences, or an interest in developing your expertise in these areas.\n\nWhere You'll Be\nThis role is based in Stockholm or London. \n We offer you the flexibility to work where you work best! There will be some in person meetings, but still allows for flexibility to work from home.", "truncated": false, "no_body": false}, {"id": "greenhouse:8240716", "board": "greenhouse:reddit", "title": "Frontend Engineer, Ads Campaign Manager", "location": "Remote - United States", "family": "Software Engineering", "url": "https://job-boards.greenhouse.io/reddit/jobs/8240716", "body": "", "truncated": false, "no_body": true}, {"id": "ashby:b614563f-3ce6-4dca-b5ba-0e5a6c8bda27", "board": "ashby:ramp", "title": "Software Engineer, Forward Deployed, AI Solutions", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/b614563f-3ce6-4dca-b5ba-0e5a6c8bda27", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n
