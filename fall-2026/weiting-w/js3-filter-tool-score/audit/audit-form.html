emote - United States", "family": "Software Engineering", "url": "https://job-boards.greenhouse.io/reddit/jobs/8369767", "body": "", "truncated": false, "no_body": true}, {"id": "lever:926149ab-6999-4058-b35d-41e302b70e05", "board": "lever:spotify", "title": "Backend Engineer - Data Platform", "location": "Stockholm", "family": "Platform", "url": "https://jobs.lever.co/spotify/926149ab-6999-4058-b35d-41e302b70e05", "body": "LilEngine is leading the Lakehouse, a company-strategic effort to make Apache Iceberg a first-class citizen in Spotify's data ecosystem. We're building it in close collaboration with Google, on open standards, so that different kinds of data are queryable the same way and teams can bring the right engine, from BigQuery to Dataflow to Trino, to the job.\nThe work has two parts. Hecate enables Iceberg for the Parquet datasets that already exist across Spotify, so teams get the benefits without rewriting their data. Alongside it, we're building the foundations of a new Lakehouse architecture that lets workflows write Iceberg tables natively. We're shipping the MVP this cycle, and you'll help shape what comes next.\nWe also own BigQuery for all of Spotify. Thousands of engineers, data scientists and pipelines depend on it every day, which puts us on the critical path for storing, finding and querying data. We're judged on reliability, cost efficiency and how quickly we unblock users when something breaks. This backend role sits where open table formats, cloud data warehouses and processing engines meet.\n\nSpotify is an equal opportunity employer. You are welcome at Spotify for who you are, no matter where you come from, what you look like, or what’s playing in your headphones. Our platform is for everyone, and so is our workplace. The more voices we have represented and amplified in our business, the more we will all thrive, contribute, and be forward-thinking! So bring us your personal experience, your perspectives, and your background. It’s in our differences that we will find the power to keep revolutionizing the way the world listens.\n \nAt Spotify, we are passionate about inclusivity and making sure our entire recruitment process is accessible to everyone. We have ways to request reasonable accommodations during the interview process and help assist in what you need. If you need accommodations at any stage of the application or interview process, please let us know - we’re here to support you in any way we can.\n\nWhat You'll Do\nBuild and evolve the lakehouse: Help build the foundations that let data workflows read and write Iceberg tables directly, from this cycle's MVP to a production-grade platform. \n Drive adoption: Help migrate data pipelines from across Spotify onto the new stack, making the move as painless as possible through tooling, standards and hands-on support. \n Own BigQuery at Spotify scale: Manage reservations and capacity, build monitoring and anti-pattern detection, and develop tooling like the BigQuery MCP server so teams can use BigQuery well. \n Keep the platform healthy: Take part in a weekly support rotation and shared on-call. You'll debug production issues that span storage formats, catalog APIs, Kubernetes reconciliation, GCP IAM and BigQuery internals, and you'll automate away recurring toil.\n\nWho You Are\nYou have solid experience building and operating backend services in production with Java or Scala. \n You're comfortable on GCP and Kubernetes. You can read kubectl output, reason about IAM and quotas, and work with CRDs and operators. You don't need deep expertise in all of these on day one. \n You've worked with Apache Iceberg or JVM-based processing frameworks like Spark, Beam or Flink, or with a cloud data warehouse such as BigQuery, Snowflake or Databricks. \n You think in systems and can connect the dots when a problem crosses several layers of the stack. \n You like owning things in production, and you're motivated by seeing your systems run reliably for thousands of users. \n You communicate clearly in writing and work well asynchronously across US and EU time zones. \n You own the quality of what you ship, including code written with AI assistance.\n\nWhere You'll Be\nThis role is based in London or Stockholm. \n \n We offer the flexibility to work where you work best! There will be some in person meeetings, but still allows for flexibility to work from home.", "truncated": false, "no_body": false}, {"id": "greenhouse:7511679", "board": "greenhouse:reddit", "title": "Senior Software Engineer, Storage", "location": "Remote - United States", "family": "Software Engineering", "url": "https://job-boards.greenhouse.io/reddit/jobs/7511679", "body": "", "truncated": false, "no_body": true}, {"id": "ashby:baa94095-c976-46d0-8d18-25a951950714", "board": "ashby:ramp", "title": "Principal Product Designer, Design Systems Lead", "location": "New York, NY (HQ)", "family": "Design", "url": "https://jobs.ashbyhq.com/ramp/baa94095-c976-46d0-8d18-25a951950714", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE\n\nHow we build software is changing. Designers are building tools and agents, prototyping in code, and shipping directly into the product. More people can create software than ever before. That makes design judgment more important, not less.\n\nWe’re looking for a Design Systems Lead to build that judgment into the foundations of Ramp.\n\nThis is not just about maintaining a component library. It’s about making it possible for designers, engineers, and agents to build experiences that look, feel, and work like Ramp—without a designer driving every decision or the design systems team reviewing every change.\n\nYou’re a designer first, with the technical depth to guide architecture and get into the code. You have exceptional taste and strong opinions about typography, hierarchy, interaction, and motion. Just as importantly, you know how to turn that judgment into patterns, tools, and guidance that make everyone else’s work better.\n\nYou’re deeply curious about AI and already using it to change how you work. You build, experiment, inspect the results, and push past the demo. You can imagine a different way of building software—and lead a team toward it.\n\nThis role is for you if you’re excited by:\n\n - Making great design reproducible. Raise the quality of Ramp’s product and encode what makes it good, so people and agents can produce coherent, usable experiences by default. The system should make excellent work easier, not make every experience look the same.\n\n - Reimagining what a design system can be. Build beyond components and tokens into composition, interaction patterns, agent guidance, and evaluations. Connect exploration and production so the fastest way to build is also a path to great quality.\n\n - Leading a team that multiplies everyone else’s impact. Create clear direction, ambitious goals, and a caring yet demanding environment. Inspire curiosity, develop people, and stay close enough to the work to help make it exceptional.\n\nThe opportunity is to raise the floor for everyone building at Ramp, while giving designers more room to make the most important experiences extraordinary.\n\n\n\n\nWHAT YOU'LL DO\n\n - Lead and develop the design systems team. Set clear priorities, ownership, and goals. Give direct, timely feedback, hold people accountable, and help them do the best work of their careers.\n\n - Own the system’s vision and direction. Decide what to preserve, evolve, simplify, or replace based on what builders and customers need. Turn that direction into focused work the team can deliver.\n\n - Elevate Ramp’s visual and interaction design. Raise the bar for typography, hierarchy, density, motion, responsive behavior, accessibility, and the states beyond the happy path.\n\n - Make design judgment usable by people and agents. Translate principles into reusable patterns, reference experiences, composition rules, and guidance that produce better work without you in the room.\n\n - Guide technical architecture with engineering. Shape everything from components and tokens to how agents discover guidance, compose interfaces, and check their work. Make sound tradeoffs between flexibility, coherence, performance, and ease of use.\n\n - Stay hands-on. Build prototypes, work in code, and get into implementation details to test ideas, unblock the team, and understand where the system breaks down.\n\n - Define and measure quality. Build repeatable evaluations grounded in real tasks. Measure whether builders can ship better work faster, with less rework—not just whether they use the tools.\n\n - Improve the path from idea to shipped experience. Partner with engineering and AI teams on workflows that support fast exploration, useful iteration, and appropriate production safeguards.\n\n - Earn adoption. Work alongside product teams, listen closely, teach through examples, and turn recurring questions and exceptions into improvements to the system.\n\n - Keep the team moving forward. Experiment as models and tools evolve, share what you learn, and change direction when the evidence calls for it.\n\n\n\n\nWHAT YOU NEED\n\n\n\n\n - Experience leading and developing strong design or design engineering teams, with a track record of setting direction and delivering meaningful outcomes.\n\n - Exceptional visual and interaction design skills. Your work shows a clear point of view, attention to detail, and an ability to make complex experiences feel simple.\n\n - Deep systems thinking and experience building systems that other teams actually adopt. You can show how your work improved both their speed and the quality of what shipped.\n\n - Strong technical fluency. You can prototype and build in code, understand front-end architecture, and work through implementation tradeoffs with engineers—not just hand off specifications.\n\n - Active, hands-on use of AI in your design and building workflow. You understand where it helps, where it fails, and how to improve its output rather than accept it.\n\n - Experience turning design principles into practical guidance, reusable patterns, and quality checks that work at sc", "truncated": true, "no_body": false}, {"id": "ashby:86abcce0-04b2-405c-9a8e-e0ca84813914", "board": "ashby:linear", "title": "Product Manager", "location": "Europe", "family": "Product", "url": "https://jobs.ashbyhq.com/linear/86abcce0-04b2-405c-9a8e-e0ca84813914", "body": "At Linear, we're building the product development system for teams and agents. AI is fundamentally changing how software gets built, and we’re shaping the tools this new era requires.\n\nFounded in 2019, Linear has become the platform of choice for more than 50,000 companies (including OpenAI, Coinbase, and Ramp) to plan, build, and ship their products. Today, our team is distributed across North America, Europe, and Australia, and we’re continuing to grow internationally. What unites us is relentless focus, fast execution, and a deep care for software craftsmanship.\n\nWe're looking for a senior to staff level Product Manager to join the team.\n\nIn this role, you'll be responsible for leading the development of products end-to-end, from conception through development and rollout. If you're excited to have a lot of ownership while remaining in the details day to day, this might be a great fit for you.\n\nLinear is a product-led company that focuses on both building and selling. It's up to you to bring together the building and selling sides of the company in order to create something that our customers will love.\n\nLocation & work mode\n\nLinear is a remote-first company, with optional co-working offices in San Francisco, New York, and London. This role is open to candidates based in North America or Europe time zones. You can work from anywhere within those regions. We value deep focus and async collaboration, with intentional moments to connect in person through team off-sites, optional co-working, and occasional travel.\n\nWhat you'll do\n\n - Perform up-front discovery through user interviews, competitive research, data analysis, etc. and present findings to the team with conviction and rigor\n\n - Help engineers and designers deeply understand user needs, empowering them to make great product decisions\n\n - Craft messaging around upcoming features that resonates with users\n\n - Enable sales and marketing teams to effectively communicate with and win with customers\n\nWhat we’re looking for\n\n - 6+ years experience in the software industry\n\n - Previous experience in engineering and/or design roles\n\n - Exceptional product and operational judgement\n\n - World-class design & product taste\n\n - Shameless curiosity, a propensity to question things deeply\n\n - Extreme speed and clarity\n\nWhat we offer\n\nWe're a small, focused team that cares deeply about the quality of our work and the people we do it with. Here's what you can expect:\n\n - Competitive salary and equity\n\n - Employee-friendly equity terms including early exercise in the US and extended exercise windows\n\n - Daily meal and coffee stipend on every workday\n\n - Paid co-working space or desk\n\n - Health coverage (based on country requirements)\n\n - 5 weeks paid vacation, plus local statutory holidays\n\n - 4 months paid parental leave\n\n - Paid month off after 4 years & every 2 years thereafter\n\n - Regular team events and off-sites\n\n - Remote-first with no required commute\n\nCompensation\n\nFor US-based candidates, the expected cash compensation range for this role is $204,000—$252,000. For sales roles, this range represents on-target earnings (OTE), including base salary and variable compensation; for all other roles, it represents base salary. Final compensation is determined based on job-related knowledge, skills, and experience. For sales roles, actual earnings vary based on sales performance. Equity is a meaningful part of all offers at Linear.\n\nLearn how we think and work\n\n - A story about our mission: Read Me https://linear.app/readme\n\n - How we work: Designing remote work at Linear https://linear.app/now/designing-remote-work-at-linear\n\n - How Linear uses Linear: How our Customer Experience team works in Linear https://linear.app/now/cx-in-linear\n\n - A video series: Conversations on Quality https://linear.app/quality\n\n - Building our teams: Why and how we do work trials at Linear https://linear.app/blog/why-and-how-we-do-work-trials-at-linear\n\n - Our recent tender offer: Sharing Linear’s growth with the people building it https://linear.app/now/sharing-growth-with-the-people-building-linear\n\nA note on recruitment fraud: all official Linear hiring communication comes from an @linear.app http://linear.app email address, and all open roles are listed at linear.app/careers http://linear.app/careers. We never ask candidates for payment or financial information. Suspicious messages can be reported to security@linear.app.\n\nLinear is an equal opportunity employer. We do not discriminate based on race, color, religion, gender identity or expression, sexual orientation, national origin, age, disability, veteran status, or any other protected characteristic under applicable law.", "truncated": false, "no_body": false}, {"id": "ashby:1d652292-04d9-405c-8101-578efd020e94", "board": "ashby:linear", "title": "Developer Relations", "location": "North America", "family": "GTM", "url": "https://jobs.ashbyhq.com/linear/1d652292-04d9-405c-8101-578efd020e94", "body": "At Linear, we're building the product development system for teams and agents. AI is fundamentally changing how software gets built, and we’re shaping the tools this new era requires.\n\nFounded in 2019, Linear has become the platform of choice for more than 50,000 companies (including OpenAI, Coinbase, and Ramp) to plan, build, and ship their products. Today, our team is distributed across North America, Europe, and Australia, and we’re continuing to grow internationally. What unites us is relentless focus, fast execution, and a deep care for software craftsmanship.\n\nLinear is becoming a much broader product than people realize. With agents, mobile workflows, and new modalities, there’s a growing gap between what Linear can do and what people think it can do. This role exists to close that gap.\n\nWe’re looking for someone who will live inside the product, discover what’s possible, and show the world. That means figuring out the most compelling use cases for Linear’s AI agent, demonstrating real workflows that teams can adopt, and getting those stories out through whatever format works best, whether that’s a tweet, a video, a blog post, or a live demo at a conference. The goal is to help people understand what they can actually do with Linear and make that feel concrete and exciting.\n\nThink of it as a product-obsessed marketer who is genuinely technical and knows how to communicate with depth.\n\nLocation & work mode\n\nLinear is a remote-first company, with optional co-working offices in San Francisco, New York, and London. This role is open to candidates based in the US and Europe. You can work from anywhere within those regions. We value deep focus and async collaboration, with intentional moments to connect in person through team off-sites, optional co-working, and occasional travel.\n\nWhat you’ll do\n\n - Deeply understand Linear’s product, especially our AI agent and newer capabilities, and continuously discover productive, real-world use cases that teams would care about\n\n - Create content that demonstrates those use cases, whether that’s short-form social, blog posts, video walkthroughs, or live demos. Format follows the story, not the other way around\n\n - Build relationships with engineering and product-focused creators and collaborate on content that feels authentic rather than sponsored\n\n - Work with our video team to produce technical product content that comes across with genuine depth\n\n - Partner with support, sales, and product on developer-facing documentation and educational content\n\n - Stay plugged into the conversations happening on X, in newsletters, and at events, and make sure Linear has a voice in the ones that matter\n\nWhat we’re looking for\n\n - Someone technical. You get code, understand how software gets built, and can talk about it credibly\n\n - Deep product intuition. You’re the kind of person who picks up a tool and immediately starts exploring what’s possible. You think in workflows and use cases rather than features\n\n - Comfortable on camera and on stage. You can demo a product, record a walkthrough, or speak at a conference without it feeling forced.\n\n - Twitter/X smart. You know how to use the platform, you understand what’s interesting to the people we’re trying to reach, and you can participate in the conversation with credibility\n\n - Curious and self-directed. You’re already finding the next interesting thing to talk about on your own, already following the right people and noticing the opportunities\n\n - Able to create video content end to end. You should be able to script, record, and edit a product walkthrough or demo without needing to hand it off to someone else\n\nWhat we offer\n\nWe're a small, focused team that cares deeply about the quality of our work and the people we do it with. Here's what you can expect:\n\n - Competitive salary and equity\n\n - Employee-friendly equity terms including early exercise in the US and extended exercise windows\n\n - Daily meal and coffee stipend on every workday\n\n - Paid co-working space or desk\n\n - Health coverage (based on country requirements)\n\n - 5 weeks paid vacation, plus local statutory holidays\n\n - 4 months paid parental leave\n\n - Paid month off after 4 years & every 2 years thereafter\n\n - Regular team events and off-sites\n\n - Remote-first with no required commute\n\nLearn how we think and work\n\n - A story about our mission: Read Me https://linear.app/readme\n\n - Our hiring process: How we hire at Linear https://linear.app/now/how-we-hire-at-linear\n\n - How we work: Designing remote work at Linear https://linear.app/now/designing-remote-work-at-linear\n\n - Our CEO and co-founder, Karri at 20VC: How to Grow Capital Efficiently in a World of BS Growth https://www.youtube.com/watch?v=4vqDYkuzbSM\n\n - Make an Org Chart You Want to Ship — Advice from Linear on How Heirloom Tomatoes Should Inspire Team Design https://review.firstround.com/make-an-org-chart-you-want-to-ship-advice-from-linear-on-how-heirloom-tomatoes-should-inspire-team-design/\n\n - Building our teams: Why and how we do work trials at Linear https://linear.app/blog/why-and-how-we-do-work-trials-at-linear\n\n - A video series: Conversations on Quality https://linear.app/quality\n\n - Our recent tender offer: Sharing Linear’s growth with the people building it https://linear.app/now/sharing-growth-with-the-people-building-linear\n\nA note on recruitment fraud: all official Linear hiring communication comes from an @linear.app http://linear.app email address, and all open roles are listed at linear.app/careers http://linear.app/careers. We never ask candidates for payment or financial information. Suspicious messages can be reported to security@linear.app.\n\nLinear is an equal opportunity employer. We do not discriminate based on race, color, religion, gender identity or expression, sexual orientation, national origin, age, disability, veteran status, or any other protected characteristic under applicable law.", "truncated": false, "no_body": false}, {"id": "ashby:624cd0cc-7471-4c9a-99be-56b90809d2ce", "board": "ashby:ramp", "title": "Technical Recruiter | Engineering ", "location": "New York, NY (HQ)", "family": "People & Talent", "url": "https://jobs.ashbyhq.com/ramp/624cd0cc-7471-4c9a-99be-56b90809d2ce", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE\n\nRamp is building something ambitious, and we believe our most important advantage is our people. This role sits at the foundation of that belief. You'll help shape how Ramp identifies, evaluates, and hires world-class engineering talent, with a particular focus on the engineers at the center of what we're building next.\n\nThis is a craft role. You'll own pipelines end-to-end, partner directly with our Engineering leadership, and be accountable for the quality of the people we bring through the door. We're looking for a Technical Recruiter who treats hiring as a discipline. Someone who cares as much about candidate experience and calibration as they do about closing.\n\nYou won't just be working off a req list. We're looking for someone who can take ambiguous or high-level direction from engineering leadership and turn it into a sharp, targeted search, knowing exactly who they want before the role even opens. You'll be expected to have strong opinions on talent, defend them with evidence, and push back on stakeholders when the bar is at risk.\n\nRecruiting at Ramp is owned end-to-end, not handed off. This role requires someone who stays close to the candidate, close to the hiring manager, and close to the work, so context never gets lost between hand-offs.\n\nWhat You’ll Do\n\n - Partner closely with our Engineering leadership and hiring managers to deeply understand the requirements of each role and how it fits into the organization\n\n - Manage full-cycle recruiting for multiple, complex searches across our Engineering organization, owning every stage from first touch to signed offer\n\n - Build deeply targeted sourcing strategies. Know the companies, the teams, and the individual engineers worth pursuing before opening a search\n\n - Partner with our sourcing team to iterate on creative strategies for talent pipelines and competitor mapping\n\n - Run candidate process with urgency and care. Same-day follow-up, next steps booked before you hang up, no candidate left chasing us\n\n - Manage pipeline activity, maintain data integrity, and proactively share data-centric updates with internal stakeholders. Spot funnel issues early and bring evidence to calibration conversations, not just gut\n\n - Drive offer processes for candidates, including extending offers, negotiations, closing candidates, and generating offer letters\n\n - Act as a strategic advisor, not a req-filler. Anticipate hiring needs, shape strategy alongside engineering stakeholders, and translate abstract asks into concrete target lists, comp frameworks, and close plans\n\n - Lead initiatives that raise the bar on how technical recruiting operates at Ramp, including interview loops, interviewer training, scorecards, and other cross-functional efforts that increase hiring quality and speed\n\n - Build excellent relationships across the recruiting team and your engineering client groups\n\nWhat We’re Looking For\n\n - 5+ years of full-cycle technical recruiting/sourcing experience in a similar role at a high-growth technology company or startup\n\n - Demonstrated track record hiring for deeply technical engineering roles. You can hold a credible conversation with a hiring manager about the work, not just the title\n\n - You build and use AI across every stage of the recruiting process, from how you find candidates to how you screen, calibrate, and close them. You're a sourcer at heart, don't wait for inbound, and treat your tooling as part of the craft\n\n - Excellent written and verbal storytelling communication skills\n\n - Ability to influence at various levels in an organization, anchoring on data-driven decision-making\n\n - Operationally strong, detail-oriented, and comfortable navigating ambiguity in a fast-moving environment\n\n - Genuine care for the candidate experience. You believe how someone is treated through the process is as much a reflection of Ramp as the offer itself\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Heal", "truncated": true, "no_body": false}, {"id": "ashby:e0b64893-0459-4d84-ac4f-7b50966ef024", "board": "ashby:ramp", "title": "Product Manager | Growth", "location": "New York, NY (HQ)", "family": "Product", "url": "https://jobs.ashbyhq.com/ramp/e0b64893-0459-4d84-ac4f-7b50966ef024", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE \n\nAs a Product Manager, Growth at Ramp, you’ll drive acquisition, activation, retention, and monetization across our product suite. You’ll identify opportunities to help more businesses discover Ramp, get value from our products, and expand their usage over time.\n\nYou’ll work closely with engineers, designers, marketers, and data scientists to develop and execute a growth strategy grounded in customer insight and experimentation. Your scope will include core product experiences and partner-led growth channels, with ownership from identifying an opportunity through launching, measuring, and scaling solutions.\n\nYou’ll identify opportunities to use AI to help businesses discover relevant Ramp products, reach value faster, and expand their usage over time. You’ll balance rapid experimentation with the accuracy, transparency, and customer trust required when building financial products.\n\nPlease note that this Product Management role will require you to be comfortable with working in-person at one of our NYC or SF offices at least 2 days/week\n\n\n\n\nWHAT YOU’LL DO\n\n - Develop and execute a growth product strategy across acquisition, activation, retention, and monetization, helping businesses get more value from Ramp\n\n - Own the roadmap, priorities, and execution for a defined growth surface area, from identifying opportunities through launching, measuring, and scaling solutions\n\n - Lead the ideation, development, and launch of growth experiences, including AI-powered approaches to onboarding, product discovery, recommendations, and cross-sell\n\n - Partner with engineering, design, marketing, and data science to deliver high-impact initiatives across core product experiences and partner-led growth channels\n\n - Conduct customer research and analyze product metrics and feedback to understand where finance teams encounter friction and identify opportunities to improve adoption\n\n - Define and track growth KPIs, design controlled experiments where feasible, and use results to distinguish incremental impact from underlying trends\n\n - Evaluate AI-powered experiences for both growth impact and quality, including accuracy, relevance, and reliability; balance rapid iteration with safeguards for sensitive financial data, transparency, and customer control\n\n - Turn successful experiments into durable product improvements and contribute to the practices that help Ramp’s product management function scale\n\n\n\n\nWHAT YOU NEED\n\n - BA/BS in mathematics, technical, or analytical field\n\n - Minimum 4 years of product management experience, building technical products from ideation to launch\n\n - Data-Driven Mindset – Fluency in crafting data-driven narratives. You enjoy writing SQL to answer your own questions and thrive on leveraging data to shape and communicate a strategic vision.\n\n - Slope - We value slope over intercept; We’re looking for a high-growth team member who can be a future leader at Ramp\n\n - Leadership & Collaboration – Proven ability to build alignment across cross-functional teams, inspire stakeholders, and lead initiatives from strategy through execution.\n\n - Passion for AI, shown through hands-on building, prototyping, or side projects, and staying current on research and tools.\n\n - Fluency with modern prototyping tools (e.g. Cursor, Codex, Claude Code) and comfort with design/collaboration environments like Figma and Git.\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chan", "truncated": true, "no_body": false}, {"id": "ashby:32fb4396-1976-45de-8137-79e6eecf40b3", "board": "ashby:ramp", "title": "Technical Consultant, Enterprise, Microsoft Dynamics F&O", "location": "Remote (US)", "family": "Sales", "url": "https://jobs.ashbyhq.com/ramp/32fb4396-1976-45de-8137-79e6eecf40b3", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE \n\nTechnical Consultants are on the frontlines working to establish partnerships with Ramp customers, and act as a liaison between customers and our internal technical teams. You'll be partnering with Customer Activation & Account Management teams to identify, prioritize and build financial solutions for new and existing customers so that Ramp continues to scale with their needs.\n\n\n\nYou will act as the technical and financial subject matter expert for our customers and design solutions that address the customer's needs through Ramp and partner integrations. You will partner with Post-Sales teams to drive Product, Design and Engineering teams' roadmaps to evolve Ramp to better serve our customers at scale and offer increasingly higher value.\n\n\n\nYou will define the customer's financial & technical success criteria from onboarding through activation and expansion. You will represent Product, Design, and Engineering externally and will operate with deep conviction and understanding of Ramp's technical capabilities. The role requires technical skills necessary to understand and educate on robust accounting features and integrate them across all the touchpoints and surface area of a customer.\n\n\n\nThis role is specifically focused on Enterprise customers running Microsoft F&O, supporting large, complex organizations with multi-entity environments, advanced ERP integrations, and highly customized financial workflows.\n\n\n\n\nWHAT YOU'LL DO\n\n - Serve as the primary Technical Consultant for Enterprise accounts running Microsoft F&O , supporting complex, high-impact customers with multi-entity, multi-ERP, and global financial environments\n\n - Act as a technical advisor to customers and Ramp's internal teams while supporting high-value implementations and expansion opportunities by guiding Microsoft F&O integration, configuration, and system design\n\n - Partner with Customer Activation and Account Management teams to assess customer requirements and propose scalable solutions involving F&O, HRIS, and API integrations\n\n - Collaborate with onboarding specialists and implementation leads to support technical workstreams, ensuring faster time-to-value and customer success\n\n - Work with customers to problem-solve technical hurdles and propose effective product implementations with a deep understanding of Dynamics F&O integration and configuration options\n\n - Participate in technical discovery to understand customer F&O environments and workflows, and recommend best-fit Ramp architecture including when and how to use Ramp's API\n\n - Be a subject matter expert across F&O and Ramp's accounting integration capabilities, partnering with Sales, Product and partners to advocate for integration development aligned with customer needs\n\n - Troubleshoot Dynamics F&O integration blockers and guide customers through complex configuration decisions\n\n - Contribute to internal documentation and tooling that scales Ramp's ability to support F&O integration use cases across a growing customer base\n\n - Influence Ramp's product roadmap by channeling F&O customer pain points and feedback to the Product and Engineering teams\n\n\nWHAT YOU NEED\n\n - Bachelor's degree in computer science, engineering, finance, business, or a related field\n\n - 4+ years in technical consulting, solutions engineering, implementation, or a similar customer-facing technical role, ideally in a SaaS or fintech environment\n\n - 3+ years of hands-on experience working with Microsoft Dynamics F&O, including financials modules, integration patterns, and enterprise deployment models\n\n - Deep familiarity with accounting workflows, including core functionalities involving General Ledger, Accounts Payable, Subledger Accounting, and multi-org structures\n\n - Comfort working with APIs, integration logic, and system architecture and being able to explain those concepts to finance and operations stakeholders\n\n - Partner closely with Product, Engineering, and Design on enterprise-driven gaps, influencing roadmap decisions that unlock scale across Ramp's largest customers\n\n - Advise on non-standard F&O implementations and edge cases, balancing customer needs with long-term platform scalability and supportability\n\n - Strong communication skills: able to translate complex technical solutions into business value and guide customers toward scalable approaches\n\n - Collaborative mindset and ability to work cross-functionally with Sales, Customer Success, Product, and Engineering\n\n - Exceptional organization and problem-solving skills, with a bias toward action and a high level of ownership\n\n - Thrives in ambiguity and fast-paced environments; adaptable and resourceful as we scale Ramp's upmarket motion\n\n\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - On", "truncated": true, "no_body": false}, {"id": "lever:ffe7380b-8c91-4201-bf60-25273493a1d8", "board": "lever:spotify", "title": "Content Marketing Manager Indonesia", "location": "Jakarta", "family": "Marketing", "url": "https://jobs.lever.co/spotify/ffe7380b-8c91-4201-bf60-25273493a1d8", "body": "At Spotify, we believe that music, podcasts, and culture move the world. We’re looking for a Content Marketing Manager to shape how Spotify shows up across Indonesia’s social platforms. You’ll help bring Spotify’s music, podcast, and cultural moments to life through storytelling that Indonesian audiences want to follow, engage with, and share.\n \nBased in Jakarta and reporting to the Content & Social Marketing Lead - Indonesia, you’ll be a hands-on member of the team, turning cultural insights and marketing priorities into locally relevant content. You’ll work closely with agency partners, creators, artists, labels, and teams across Spotify to develop and deliver content across TikTok, Instagram, X, and emerging channels. You’ll combine strong creative instincts with performance insights to understand what’s working, adapt quickly, and keep Spotify relevant in fast-moving cultural conversations.\n\nWhat You'll Do\nOwn the day-to-day execution of Spotify Indonesia’s social channels across Meta, TikTok, X, and emerging platforms, helping strengthen Spotify’s position as a go-to platform for music and podcast fans in Indonesia. \n Contribute to Spotify’s social voice and presence in Indonesia, creating culturally relevant, platform-native storytelling that feels authentic to local audiences while remaining consistent with Spotify’s brand. \n Lead content marketing initiatives tied to artist and podcast releases, live events, editorial moments, and on-platform campaigns, including video content from ideation through distribution. \n Spot cultural trends, fandom signals, emerging formats, and conversations early, translating them into relevant content opportunities for Spotify. \n Brief and collaborate with agencies and internal cross-functional teams to develop and produce content across social and other relevant media channels. \n Build and maintain relationships with artists, labels, podcast and video creators, agencies, and internal partners, identifying opportunities for content and co-creation while managing expectations and keeping projects moving. \n Navigate a high-volume stakeholder environment across Marketing, Creative, Editorial, artist and label partnerships, and global teams while maintaining alignment and delivering at pace. \n Use data and performance insights to evaluate content, optimize approaches, and clearly communicate learnings and recommendations to internal partners. \n Share learnings and best practices with regional and global teams, contributing to how Spotify approaches content and social marketing across markets.\n\nWho You Are\nYou have 7+ years of experience in content marketing, including social media, with experience spanning strategy and creative work in Indonesia. \n You have a strong understanding of Indonesia’s digital and social landscape, fandom behavior, cultural conversations, and the ways audiences engage across different platforms. \n You have experience working with creators, agencies, and cross-functional teams to deliver impactful social and content campaigns. \n You’re confident planning and developing social media and content marketing strategies that can extend across other relevant media channels. \n You have strong creative instincts and are deeply connected to internet culture, music, podcasts, and fandoms, with an eye for emerging trends, formats, and conversations. \n You’re comfortable using data and insights to inform creative decisions, measure performance, and optimize campaigns. \n You’re skilled at managing multiple stakeholders across internal teams, external partners, agencies, and creator ecosystems. \n You’re organized and comfortable managing multiple projects and priorities in a fast-moving environment. \n You have strong communication skills in Bahasa Indonesia and English. You’re familiar with Spotify as a product and understand how audiences use and engage with the platform. \n Experience across broader marketing and media channels, including creator and influencer marketing, will help you thrive in this role.\n\nWhere You'll Be\nThis role is based in Jakarta. \n We offer you the flexibility to work where you work best! There will be some in person meetings, but still allows for flexibility to work from home.", "truncated": false, "no_body": false}, {"id": "greenhouse:8104403", "board": "greenhouse:reddit", "title": "Senior Data Scientist, Ads", "location": "Remote - United States", "family": "Data Science", "url": "https://job-boards.greenhouse.io/reddit/jobs/8104403", "body": "", "truncated": false, "no_body": true}, {"id": "lever:a57db22d-dc0d-4f36-9a2e-34acdf1ec046", "board": "lever:spotify", "title": "Senior Product Manager - Subscriptions (Premium Desirability)", "location": "London", "family": "Subscriptions R&D", "url": "https://jobs.lever.co/spotify/a57db22d-dc0d-4f36-9a2e-34acdf1ec046", "body": "Spotify's mission is to unlock the potential of human creativity by giving a million creative artists the opportunity to live off their art and billions of fans the chance to enjoy and be passionate about these creators.\nThe Subscriptions Mission builds and evolves Spotify's subscription products and marketplace experiences to drive sustainable user and revenue growth globally. We focus on awareness, acquisition, activation, retention, and monetization strategies that help users unlock the full value of Spotify while enabling the business to scale efficiently and responsibly.\nThis role focuses on the awareness, acquisition, and activation layers of the Subscriptions Mission, making Premium feel unmissable to free users long before a purchase decision. You'll own the strategy for how users discover, understand, and develop intent for Premium value, partnering closely with product, design, engineering, research, marketing, and data science to shape the moments, surfaces, and experiences that drive consideration across markets and segments.\n\nWhat You Will Do\nOwn the product strategy and roadmap for Premium awareness, acquisition, and activation, helping more listeners discover its value and take the next step toward subscribing. \n Lead the discovery, development, and launch of consumer-facing product experiences, from early ideas and testing through to global rollout. \n Shape how people experience Premium across Spotify and partner channels, creating engaging journeys that build consideration, encourage subscription, and support long-term retention. \n Collaborate with partnerships and commercial teams to develop, launch, and scale subscription offerings across partners, markets, and audience segments. \n Lead experimentation to understand what drives interest in Premium, using A/B testing and behavioral insights to improve the user journey and measure business impact. \n Turn customer insights, market trends, and performance data into clear product opportunities, measurable goals, and informed priorities. \n Balance user needs, business outcomes, partner requirements, and regional differences to make thoughtful product decisions that deliver sustainable growth. \n Bring teams together around a shared direction, communicating product strategy, results, and trade-offs clearly to stakeholders and senior leaders.\n\nWhere You'll Be\nYou have a strong track record in product management, building and launching consumer-facing products at scale, with experience in areas such as subscriptions, consumer growth, marketplaces, media, or partner ecosystems. \n You understand what makes a product valuable to consumers and how product experiences, positioning, and messaging influence consideration and willingness to pay. \n You know how to identify opportunities across the customer journey, from awareness and acquisition through conversion and retention, and connect product decisions to subscriber and revenue growth. \n You're confident designing experiments, interpreting A/B tests, and using funnel, cohort, and behavioral data to make informed product decisions. \n You have experience working across different markets and customer segments, balancing globally consistent experiences with local needs and opportunities. \n You bring sound product judgment, knowing when to improve an existing experience, explore a new approach, or invest in longer-term capabilities. \n You're a thoughtful communicator and collaborative partner who can bring together diverse perspectives, influence decisions, and align cross-functional teams around shared goals. \n You're comfortable navigating ambiguity, testing assumptions, learning from outcomes, and adapting your approach as new insights emerge.\n\nWhere You Will Be\nThis role is based in London, United Kingdom or Stockholm, Sweden. \n We offer you the flexibility to work where you work best! There will be some in person meetings, but still allows for flexibility to work from home.", "truncated": false, "no_body": false}, {"id": "ashby:7bfa613e-151c-469b-9973-c89ee3d14838", "board": "ashby:ramp", "title": "Backend Engineer, Ops Engineering", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/7bfa613e-151c-469b-9973-c89ee3d14838", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\nJoin our growing Ops Engineering team and help build internal tooling and infrastructure that empowers operators at Ramp. As an internal-facing team, you'll work directly with our operations teams to design, implement, and scale tools and systems that enable them to serve our customers more efficiently and effectively. Much of our work involves managing the Retool platform, building custom tooling on top of platforms like Zendesk, developing internal API to support internal operations, and creating operator-facing applications that help our ops teams move faster and deliver better customer experiences.\n\nRamp is, at its core, an engineering company, and is on a mission to build the best engineering team in the world! The Ops Engineering team is highly cross-functional, working closely with operations, customer support, and other internal stakeholders to solve a wide range of infrastructure and tooling challenges. Our ideal candidate has a strong sense of ownership and enjoys owning projects from inception to scaling them in production. We value people who take pride in their work, and show an aptitude for learning quickly whether they're familiar with our stack or not. You'll be working with a nimble team of committed and talented engineers and having a large, long-term impact on technical design and engineering culture. We are intentionally pushing to use AI to automate workflows end-to-end, reducing manual toil and standardizing patterns across Retool, Zendesk, and our internal APIs.\n\n\n\nWhat You'll Do\n\n - Design and build full-stack internal applications and tools that empower operations teams to work more efficiently and deliver exceptional customer experiences\n\n - Develop robust backend services and APIs that power internal tooling, ensuring scalability, reliability, and performance\n\n - Build integrations with third-party platforms like Retool, Zendesk, and other operational systems to create seamless workflows\n\n - Leverage AI tooling and capabilities to build intelligent automation, enhance operator productivity, and improve decision-making within internal tools\n\n - Create data-driven features and analytics that provide operations teams with actionable insights and improved visibility\n\n - Collaborate closely with operations stakeholders to understand pain points, gather requirements, and iterate on solutions that solve real business problems\n\n - Write clean, maintainable, and well-tested code following software engineering best practices\n\n - Participate in code reviews, mentor team members, and contribute to the growth of engineering culture\n\n - Own features end-to-end from design through deployment, monitoring, and iteration based on user feedback\n\n - Participate in an On Call rotation to resolve critical issues impacting internal users\n\n\n\nWhat You'll Need\n\n - 5+ years of software engineering experience building and shipping production applications\n\n - Strong proficiency in modern programming languages such as Python, TypeScript/Node.js, or similar\n\n - Experience building full-stack applications with modern frameworks (React, Next.js, or similar for frontend)\n\n - Solid understanding of backend architecture, API design, and database systems (PostgreSQL, Redis, etc.)\n\n - Demonstrated aptitude for working with AI technologies, including experience integrating LLMs, building AI-powered features, or applying AI to solve business problems\n\n - Experience building internal tools or working closely with non-technical stakeholders to understand and solve their problems\n\n - Strong product sense and user empathy, with ability to translate business requirements into technical solutions\n\n - Familiarity with cloud infrastructure (AWS preferred) and modern DevOps practices\n\n - Excellent communication skills and ability to work cross-functionally with operations, product, and engineering teams\n\n - Strong sense of ownership and bias toward action, with ability to move quickly and iterate based on feedback\n\n - Experience with platforms like Retool, Zendesk, or similar internal tooling platforms is a plus\n   \n   \n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 ", "truncated": true, "no_body": false}, {"id": "ashby:6511d68f-b65d-4499-962f-7e2f75eabe3f", "board": "ashby:ramp", "title": "Software Engineer, Frontend", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/6511d68f-b65d-4499-962f-7e2f75eabe3f", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE\n\nOur ideal candidate has a deep understanding of JavaScript, a passion for web performance, and can creatively come up with solutions to solve customer's needs. Our tech stack currently involves TypeScript, React, Vite, and Ryu, our in-house design system.\n\nCheck out our Engineering Blog https://engineering.ramp.com/ for more on our tech stack, mission and values!\n\n \n\n\nWHAT YOU’LL DO\n\n - Build! \n\n - Lead the design of performant, beautiful, and usable interfaces \n\n - Collaborate on our technical vision. Lead discussions and implementation of multiple complex projects\n\n - Foster a culture of upholding industry-leading UX\n\n - Continuously improve our engineering processes, tools, and systems that allow us to scale the code base, productivity, and the team\n\n - Recruit, interview and develop your own interview questions, while fostering the culture of excellence, velocity and humility\n\n - Inspire and mentor less experienced engineers and interns\n\n \n\n\nWHAT YOU'LL NEED\n\n - Minimum of 5 years of frontend engineering experience preferred\n\n - Proficiency in JavaScript and React\n\n - Knack for getting the visuals right\n\n - Track record of shipping high-quality products and developing projects at scale\n\n - Ability to turn business and product ideas into engineering solutions\n\n - Desire to work in a fast-paced environment, continuously grow, and master your craft\n\n - Alignment with Ramp’s core values of enabling businesses to grow more by spending less\n\n\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n \n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n \n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice", "truncated": false, "no_body": false}, {"id": "ashby:c0a71032-1efb-40dc-b1e8-aa0f30cd5961", "board": "ashby:ramp", "title": "Software Engineer, Backend, Accounting", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/c0a71032-1efb-40dc-b1e8-aa0f30cd5961", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE\n\nFinance teams need a dependable way to turn everyday spending and payments into accurate books. Ramp's Accounting team builds the systems that carry accounting context across our products, help customers categorize and reconcile activity, and keep their records in sync. When those systems work well, finance teams spend less time correcting data and more time understanding their business.\n\n\n\nWe're looking for a Senior Backend Engineer to build across that accounting experience. You could work on the services behind accounting rules and data models, the flow of transactions into the books, or the reliability of sync and reconciliation workflows. You'll own complex projects from design through production and work with product, design, and engineering partners to make accounting workflows simpler and more trustworthy for customers.\n\n\n\n\nWHAT YOU’LL DO\n\n - Design and build backend services, APIs, and data models that support accounting workflows across Ramp's products\n\n - Make financial data accurate, traceable, and resilient as transactions move through coding, reconciliation, and sync\n\n - Improve the reliability and visibility of workflows that span Ramp and customers' accounting systems, including how they handle failures and changes\n\n - Partner with product and engineering teammates to understand finance teams' needs and turn them into practical technical designs\n\n - Own substantial projects from design and implementation through launch, monitoring, and iteration\n\n - Raise the engineering bar through thoughtful design reviews, code reviews, and mentorship\n\n\n\n\nWHAT YOU’LL NEED\n\n - Experience designing, building, and operating production backend systems, including APIs, data models, and asynchronous workflows\n\n - Strong system design judgment, especially around data correctness, reliability, and keeping complex systems understandable\n\n - A track record of independently owning complex projects and shipping high-quality software\n\n - The ability to investigate problems across services and data flows and turn what you learn into durable improvements\n\n - Clear communication and a collaborative approach to technical decisions and feedback\n\n\n\n\nNICE TO HAVES\n\n - Experience with accounting, payments, spend management, or other financial data products\n\n - Familiarity with accounting concepts such as coding, reconciliation, or the general ledger\n\n - Experience building integrations or data workflows that keep information consistent across systems\n\n\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n \n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n \n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice", "truncated": false, "no_body": false}, {"id": "ashby:b7514711-8a29-4bd2-a97a-967be14e336f", "board": "ashby:ramp", "title": "Software Engineer, Backend, AI Spend Management", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/b7514711-8a29-4bd2-a97a-967be14e336f", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE\n\nRamp’s AI Spend Management team helps finance and technical teams understand and manage what they spend across AI providers and subscriptions. We are building the third pillar https://ramp.com/blog/ramp-at-44-billion-the-third-pillar of finance. The product brings provider usage and billing information together so customers can see where costs come from, attribute spend, and act on it with greater confidence.\n\n\nWe’re looking for a senior backend engineer to build the systems behind that experience. You’ll own substantial projects from design through production, turn data from different providers into dependable product experiences, and work with product, design, data, and engineering partners to make complex spend information useful to customers. You will be involved in key company initiatives such as inference accounting, and figuring out new and novel ways to help companies not just manage, but think about their AI Spend.\n\n\n\n\nWHAT YOU’LL DO\n\n - Design and build backend services and APIs that support AI spend visibility, attribution, insights, and controls\n\n - Build and improve integrations that ingest usage and billing information from supported providers\n\n - Taking the data from those integrations and converting it into helpful structures for external customers, and internal product consumers\n\n - Create reliable data models and processing workflows that make spend information accurate, traceable, and useful across the product\n\n - Own projects from technical design through launch, monitoring, and iteration\n\n - Improve the reliability, performance, and observability of systems as customer usage and provider coverage grow\n\n - Partner with product, design, data, and engineering teammates to turn customer needs into practical solutions\n\n - Raise the engineering bar through thoughtful design reviews, code reviews, and mentorship\n\n\n\n\nWHAT YOU’LL NEED\n\n - Experience designing, building, and operating production backend systems, including APIs, data models, and asynchronous workflows\n\n - Strong judgment about system design, data correctness, reliability, and when to keep a solution simple\n\n - A track record of independently owning complex projects and shipping high-quality software\n\n - Experience working with external data sources or integrations where data quality and changing interfaces matter\n\n - Comfort working through ambiguous product problems with cross-functional partners\n\n - Clear communication and a collaborative approach to technical decisions and feedback\n\n\n\n\nNICE TO HAVES\n\n - Experience with usage metering, billing, spend management, or financial data products\n\n - Experience integrating with AI providers or other third-party usage and billing APIs\n\n - Experience building attribution, alerts, limits, or other systems that help customers understand and manage spend\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n \n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n \n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice", "truncated": false, "no_body": false}, {"id": "greenhouse:6960831", "board": "greenhouse:reddit", "title": "Senior Machine Learning Engineer", "location": "Remote - United States", "family": "Machine Learning", "url": "https://job-boards.greenhouse.io/reddit/jobs/6960831", "body": "", "truncated": false, "no_body": true}, {"id": "lever:05b8d6ee-0773-4255-b8b9-ae73d74a5ee5", "board": "lever:spotify", "title": "Senior Machine Learning Engineer, Personalization", "location": "New York, NY", "family": "Personalization", "url": "https://jobs.lever.co/spotify/05b8d6ee-0773-4255-b8b9-ae73d74a5ee5", "body": "Spotify is an equal opportunity employer. You are welcome at Spotify for who you are, no matter where you come from, what you look like, or what’s playing in your headphones. Our platform is for everyone, and so is our workplace. The more voices we have represented and amplified in our business, the more we will all thrive, contribute, and be forward-thinking! So bring us your personal experience, your perspectives, and your background. It’s in our differences that we will find the power to keep revolutionizing the way the world listens.\n \nAt Spotify, we are passionate about inclusivity and making sure our entire recruitment process is accessible to everyone. We have ways to request reasonable accommodations during the interview process and help assist in what you need. If you need accommodations at any stage of the application or interview process, please let us know - we’re here to support you in any way we can.\n\nWhat You'll Do\nBuild and improve machine learning models that make Spotify Search more relevant, personalized, and engaging for listeners. \n Develop and optimize ranking and backend retrieval systems that help listeners discover music, videos, audiobooks, and other content. \n Explore emerging AI and agentic approaches to create more intuitive and conversational Search experiences. \n Design, implement, and evaluate machine learning solutions, taking ideas from early experimentation through production. \n Partner with engineers, product managers, designers, and researchers to identify opportunities and deliver meaningful improvements to Search. \n Use experimentation, data analysis, and performance metrics to understand model behavior, validate hypotheses, and improve the listener experience. \n Contribute to scalable machine learning infrastructure and engineering practices that support reliable, high-quality Search experiences. \n Share knowledge, challenge assumptions constructively, and help shape the technical direction of machine learning within the squad.\n\nWho You Are\nYou have experience building, deploying, and improving machine learning systems in production environments. \n You have a strong understanding of machine learning approaches for information retrieval, search ranking, recommendation systems, or personalization. \n You are proficient in Python and comfortable working with modern machine learning frameworks and data processing tools. \n You have experience and a desire to lean into backend engineering at Spotify scale. \n You understand how to design and evaluate experiments, interpret model performance, and translate technical findings into product improvements. \n You have experience working with large-scale datasets and understand the challenges of building reliable, scalable machine learning systems. \n You are curious about emerging AI technologies, including large language models and agentic systems, and interested in their potential to improve discovery experiences. \n You enjoy working across disciplines, communicating technical ideas clearly, and learning from different perspectives. \n You are comfortable navigating ambiguity, taking ownership of complex challenges, and balancing experimentation with practical delivery.\n\nWhere You'll Be\nThis role is based in Eastern Standard Time \n We offer you the flexibility to work where you work best! There will be some in person meetings, but still allows for flexibility to work from home.", "truncated": false, "no_body": false}, {"id": "ashby:8086c65e-b4cc-4bdd-8f1f-5bdf03130ff4", "board": "ashby:ramp", "title": "Customer Activation Manager | Mid-Market", "location": "New York, NY (HQ)", "family": "Sales", "url": "https://jobs.ashbyhq.com/ramp/8086c65e-b4cc-4bdd-8f1f-5bdf03130ff4", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\nAbout the Role\n\nRamp's Mid-Market Customer Activation Managers don't manage accounts — they transform how companies run their finances. This is a role fo
