\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE\n\nCompanies are adopting AI across more teams, but most still struggle to produce real workflows, measurable outcomes, and efficient spend. Ramp’s AI Solutions team helps customers turn that spend into working systems: agents, automations, and integrations that run real finance operations, built on top of Ramp’s growing AI product stack, including Glass, Inspect, Router, and Token Spend Management.\n\nAs a software engineer on AI Solutions, you'll co-lead customer engagements with an AI Solutions Strategist while also helping turn repeated customer needs into platform capabilities across Ramp’s AI product stack. The Strategist owns business discovery, the ROI story, stakeholder alignment, and rollout planning. You own the technical side: discovery, solution design, prototyping, implementation, production readiness, and the product feedback loop back into our platform and AI primitives.\n\nThis is a deeply client-facing, hands-on building role based in New York, with occasional travel depending on engagements. You'll take projects from a customer's first workflow-discovery sessions through launch and into steady, measurable production use — then turn what you learned into reusable product patterns the next customer can adopt without starting from zero.\n\n\n\n\nWHAT YOU'LL DO\n\n - Ship production AI workflows for the companies we partner with — agents, automations, and integrations their teams use every day.\n\n - Translate customer work into platform work by identifying needs across deployments and helping improve Ramp’s AI primitives.\n\n - Make the next deployment easier by turning customer specific work into reusable components, product feedback, reference architectures, and playbooks.\n\n - Run technical discovery with customers: current workflows, systems, data quality, constraints, and what's blocking adoption.\n\n - Turn customer goals into concrete requirements, including security, privacy, reliability, performance, scalability, and cost.\n\n - Prototype fast with end users to de-risk the approach before you build it out.\n\n - Own the technical plan end to end: architecture and data flow, integrations across Ramp and customer systems, permissions and auditability, evals and acceptance tests, and monitoring and runbooks.\n\n - Measure what you ship — quality, adoption, and cost — and stay with it until it's reliable, supportable, and handed off.\n\n\nWHAT YOU NEED\n\n - A track record of building from 0 to 1 in ambiguous environments: finding the real problem, shipping a first version quickly, learning from users, and hardening it over time.\n\n - Hands-on experience building LLM systems — agents, RAG, evals, and monitoring — and sound judgment on trade-offs like quality, latency, cost, and model choice.\n\n - Strong coding ability in Python, TypeScript/JavaScript, Java, Go, or similar.\n\n - Comfort working across APIs, integrations, data pipelines, and cloud infrastructure (AWS, GCP, or Azure), and designing systems that are secure and scale.\n\n - Experience working directly with customers or end users: you can scope an ambiguous problem with a room of stakeholders and write clear technical docs afterward.\n\n - Strong written communication. You can produce technical plans, customer facing explanations, handoff docs, and clearly explain tradeoffs.\n\n - Willingness to travel up to ~50%, flexible based on project and customer needs.\n\nNice to have\n\n - Background in forward deployed engineering, solutions architecture, technical consulting, or sales engineering.\n\n - Familiarity with finance operations workflows such as AP, procurement, expenses, close, reconciliation, and reporting.\n\n - Experience turning repeated customer needs into reusable product primitives, internal tools, or implementation playbooks.\n\n - Experience optimizing AI cost or performance, such as model routing, caching, or token spend analysis.\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Pri", "truncated": true, "no_body": false}, {"id": "lever:186b763a-2a61-4563-8813-ff6b40c9c8a7", "board": "lever:spotify", "title": "Backend Engineer - Data Platform", "location": "Stockholm", "family": "Platform", "url": "https://jobs.lever.co/spotify/186b763a-2a61-4563-8813-ff6b40c9c8a7", "body": "Every dataset at Spotify, from the data behind creator royalties to the signals powering recommendations, is registered, published and traced through systems our team builds. We're the source of truth for what data exists at Spotify, where it lives, who owns it, and how it flows from one pipeline to the next.\nThese systems sit on the critical path of the platform. Data teams use them every day to publish and find data, and other platform teams build on them for access, retention, governance and incident response. That means our work is judged on correctness and reliability, because every system built on top of ours is only as good as the metadata we provide.\nThis is a backend role focused on data management, working on the problems at the core of any large data platform: running a data catalog that stays accurate at scale, capturing lineage across batch and streaming workloads, managing schemas as they evolve, and guaranteeing that consumers only read complete data. We build on open standards like OpenLineage and Apache Iceberg, and define the internal standards for naming, storage and metadata that the rest of Spotify builds against. As the platform takes on new storage technologies and new kinds of data assets, those standards and the systems behind them have to evolve with it, and you'll help decide how.\n\nSpotify is an equal opportunity employer. You are welcome at Spotify for who you are, no matter where you come from, what you look like, or what’s playing in your headphones. Our platform is for everyone, and so is our workplace. The more voices we have represented and amplified in our business, the more we will all thrive, contribute, and be forward-thinking! So bring us your personal experience, your perspectives, and your background. It’s in our differences that we will find the power to keep revolutionizing the way the world listens.\n \nAt Spotify, we are passionate about inclusivity and making sure our entire recruitment process is accessible to everyone. We have ways to request reasonable accommodations during the interview process and help assist in what you need. If you need accommodations at any stage of the application or interview process, please let us know - we’re here to support you in any way we can.\n\nWhat You'll Do\nBuild and Evolve Core Services: Design, build and operate the backend services and APIs behind our data catalog, lineage and publishing systems, and evolve them as the platform adopts new storage technologies and new kinds of data. Hold them to a high bar for correctness, performance and reliability. \n Build Data Pipelines: Develop and run the batch and streaming pipelines that keep our metadata current, processing platform events and audit logs to capture how data is created and changed, and turning lineage and metadata into data products other teams build on. \n Own Projects End to End: Turn what the teams using our platform need into technical designs, drive them through delivery and rollout, and own the results once they're in production. \n Keep the Platform Healthy: Take part in on-call for critical services, build in observability and quality checks by default, and use automation, including AI tooling, to reduce toil for the team and our users.\n\nWho You Are\nYou have solid experience building and running backend services and APIs in production with Java, and you care about API design, versioning and backward compatibility. \n You're comfortable with SQL and have worked with data pipelines or a cloud data warehouse such as BigQuery, Snowflake or Databricks. Hands-on experience with batch or streaming frameworks like Beam, Flink or Spark is a plus. \n You have a working understanding of data engineering concepts such as orchestration, metadata management, data quality, governance and lineage. \n You break problems down into clear, shippable steps, reasoning through tradeoffs and risks and converging on clear recommendations. \n You own the quality of what you ship, including code written with AI assistance, and you care about operating it well after launch. \n You are a strong communicator and collaborator who enjoys working across teams, and you're comfortable in a dynamic platform environment where many engineers depend on what you build and priorities evolve with the business.\n\nWhere You'll Be\nThis role is based in Stockholm or London. \n We offer you the flexibility to work where you work best! There will be some in person meetings, but still allows for flexibility to work from home.", "truncated": false, "no_body": false}, {"id": "lever:93b9a474-0e4e-4214-9c9a-974496478068", "board": "lever:spotify", "title": "Artist & Label Partnerships Manager - GSA (15-month fixed-term)", "location": "Berlin", "family": "Music Business", "url": "https://jobs.lever.co/spotify/93b9a474-0e4e-4214-9c9a-974496478068", "body": "We have a great opportunity for an Artist & Label Partnerships Manager to come and join the band in Berlin. The Artist & Label Partnerships team is the face of Spotify to artists, managers, labels & distributors.\nAs an Artist & Label Partnerships Manager your mission is to ensure that key artists, managers, and labels see Spotify as the #1 partner for artist development and monetization.\nIn this role you will work with a set of core label partners and artists. This role has a strong focus on launching innovative partnerships and initiatives and you will drive activations that enable, educate, and unlock new opportunities for our partners and Spotify. \nWe seek a highly motivated partner manager based in Berlin with a strong partnerships, music marketing and music / entertainment / media background. This individual must be able to prioritize, multi-task, and influence in a fast paced environment. \nThis role is on a 15-month fixed-term contract.\n\nSpotify is an equal opportunity employer. You are welcome at Spotify for who you are, no matter where you come from, what you look like, or what’s playing in your headphones. Our platform is for everyone, and so is our workplace. The more voices we have represented and amplified in our business, the more we will all thrive, contribute, and be forward-thinking! So bring us your personal experience, your perspectives, and your background. It’s in our differences that we will find the power to keep revolutionizing the way the world listens.\n \nAt Spotify, we are passionate about inclusivity and making sure our entire recruitment process is accessible to everyone. We have ways to request reasonable accommodations during the interview process and help assist in what you need. If you need accommodations at any stage of the application or interview process, please let us know - we’re here to support you in any way we can.\n\nWhat You'll Do\nBuild and foster relations with key partners (artists, managers, labels, industry organizations) across Germany, Austria and Switzerland \n Act as a representative of Spotify externally in the music industry and empower artists and labels with knowledge, insights, and tools they need to succeed on Spotify, acting as their advocate and champion. \n Music Marketing and culture: Stay ahead of music trends and key moments to proactively identify and activate new music and content opportunities. \n IRL events and music marketing: Proactively identify and pursue new growth opportunities in areas such as superfan engagement and live events together with cross-functional teams, work together to bring these initiatives to life. \n Cross-Functional Collaboration: Work closely with Consumer Marketing, PR and other teams, acting as a representative of the artists & labels you work with.\n\nWho You Are\nYou have 2+ years of music industry experience, preferably in an artist & partner-facing role. \n You have experience and knowledge working in a broad spectrum of culture with a focus on music and content. \n You have expertise in the electronic music space (preferred) \n You have a strong understanding of the digital music landscape and streaming platforms. \n You are an excellent project manager with a track record in leading projects from end to end, including marketing campaigns, live events and cultural activations \n You have experience in project managing offline to online activations, incl. Working on live events, content capture and digital extensions of those \n You possess excellent negotiating, presentation and people skills \n You are comfortable in very fast paced, driven work environments and can do well in a team that moves quickly \n You are well organized, with the ability to plan and deliver on tight deadlines \n You're a great teammate, adapt well to change, and have a positive attitude \n You are fluent in German and English\n\nWhere You'll Be\nThis role is based in Berlin, Germany \n We offer you the flexibility to work where you work best! There will be some in person meetings, but still allows for flexibility to work from home. We ask that you come into the office 2-3 times per week.", "truncated": false, "no_body": false}, {"id": "ashby:41b3ed5c-f7a0-40b7-8a77-4952868c3d47", "board": "ashby:linear", "title": "Product Support Specialist, APAC", "location": "Singapore", "family": "GTM", "url": "https://jobs.ashbyhq.com/linear/41b3ed5c-f7a0-40b7-8a77-4952868c3d47", "body": "At Linear, we're building the product development system for teams and agents. AI is fundamentally changing how software gets built, and we’re shaping the tools this new era requires.\n\nFounded in 2019, Linear has become the platform of choice for more than 50,000 companies (including OpenAI, Coinbase, and Ramp) to plan, build, and ship their products. Today, our team is distributed across North America, Europe, and Australia, and we’re continuing to grow internationally. What unites us is relentless focus, fast execution, and a deep care for software craftsmanship.\n\nOver the past years, Linear has experienced incredible organic growth and has become an instrumental tool for many of the world’s best product teams. We believe customer support should always feel like an extension of that experience. As a Product Support Specialist at Linear, you’ll contribute to the future of our product by surfacing customer feedback and insights, contributing to our technical documentation, and engaging a technical customer community via social channels.\n\nLocation & work mode\n\nLinear is a remote-first company, with optional co-working offices in San Francisco, New York, and London. This role is open to candidates residing in Australia or Singapore only. You can work from anywhere within those countries. We value deep focus and async collaboration, with intentional moments to connect in person through team off-sites, optional co-working, and occasional travel.\n\nWhat you’ll do\n\n - Support customers in end-to-end engagement, including onboarding, account setup, debugging issues, feature and integration discovery\n\n - Investigate and resolve inbound customer issues reported through a variety of communication channels, including email, Slack, Twitter, and Reddit\n\n - Partner with our engineering team to document and reproduce bugs\n\n - Surface trends and insights from customer feedback to the team at large to inform product choices\n\n - Lead select strategic projects to improve the support experience, internal knowledge sharing, and product operations\n\n - Deliver high-touch Enterprise support at scale, navigating complex account needs alongside Customer Success and Sales\n\nRequirements\n\n - Passion about technology, quality, and Linear’s mission\n\n - Excellent communication and customer service skills and experience working with a technical or engineering user base. Ability to adapt your communication approach to non-technical users.\n\n - Experience troubleshooting technical issues, including APIs and integration setups. Ability to reproduce bugs with Linear and our integrations in various environments (different browsers, Windows, Mac, Mobile).\n\n - Familiarity with SQL, Javascript, APIs, and GitHub is a plus. If you don’t have direct experience in these areas, curiosity to learn more is desirable as well. Please note that this is not a product engineering role.\n\n - Currently based in Australia or Singapore.\n\nWhat we offer\n\nWe're a small, focused team that cares deeply about the quality of our work and the people we do it with. Here's what you can expect:\n\n - Competitive salary and equity\n\n - Employee-friendly equity terms including early exercise in the US and extended exercise windows\n\n - Daily meal and coffee stipend on every workday\n\n - Paid co-working space or desk\n\n - Health coverage (based on country requirements)\n\n - 5 weeks paid vacation, plus local statutory holidays\n\n - 4 months paid parental leave\n\n - Paid month off after 4 years & every 2 years thereafter\n\n - Regular team events and off-sites\n\n - Remote-first with no required commute\n\nLearn how we think and work\n\n - A story about our mission: Read Me https://linear.app/readme\n\n - Building our teams: Why and how we do work trials at Linear https://linear.app/blog/why-and-how-we-do-work-trials-at-linear\n\n - How we work: Designing remote work at Linear https://linear.app/now/designing-remote-work-at-linear\n\n - How Linear uses Linear: How our Customer Experience team works in Linear https://linear.app/now/cx-in-linear\n\n - A video series: Conversations on Quality https://linear.app/quality\n\n - Our recent tender offer: Sharing Linear’s growth with the people building it https://linear.app/now/sharing-growth-with-the-people-building-linear\n\nA note on recruitment fraud: all official Linear hiring communication comes from an @linear.app http://linear.app email address, and all open roles are listed at linear.app/careers http://linear.app/careers. We never ask candidates for payment or financial information. Suspicious messages can be reported to security@linear.app.\n\nLinear is an equal opportunity employer. We do not discriminate based on race, color, religion, gender identity or expression, sexual orientation, national origin, age, disability, veteran status, or any other protected characteristic under applicable law.", "truncated": false, "no_body": false}, {"id": "ashby:be496b52-cfbf-494e-b862-61fb4a188b24", "board": "ashby:ramp", "title": "Software Engineer, Production Engineering", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/be496b52-cfbf-494e-b862-61fb4a188b24", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT PRODUCTION ENGINEERING\n\nProduction Engineering is Ramp's infrastructure ownership layer. We exist to make Ramp faster, more reliable, and more scalable — and we do that by being embedded in the problems, not adjacent to them.\n\nA few things that define how we operate:\n\n - One team, one company, one objective. There is no \"infra team\" and \"product team\" — there is Ramp. We share the company's goals as our own. When a product team struggles with reliability or scalability, that is our struggle.\n\n - If reliability or scalability is at risk, we own it. We don't wait to be invited, and we don't ask whose code it is. If a system is slow, if it breaks, if it won't scale — that's ours to lead, regardless of where it lives in the stack.\n\n - We go first, and we go fast. When the path isn't obvious, we don't wait for someone else to find it. We move with urgency, propose the solution, align the stakeholders, and stay in until it's done — not until our ticket is closed.\n\n - We lead the way. We find the next problem before it finds us. And when we solve it, we don't just fix it for ourselves — the patterns and standards we establish become the foundation the rest of Ramp builds on. That's not a side effect of the job; it's the job.\n\n - We stay calibrated. Speed means nothing if we're moving in the wrong direction. We regularly stop and ask honestly whether what we're working on is still the highest-leverage thing we could be doing — the discipline that makes sure our effort compounds toward what actually matters.\n\nYou cannot build the future of finance on shaky infrastructure.\n\n\n\n\nOUR TEAMS\n\nProduction Engineering is organized into teams — but we think about teams differently. Teams are mutable. We build them around what needs to be done, not around what we need to do given the teams we already have. The structure below reflects our current priorities; it will evolve as Ramp does.\n\nRight now, we operate across four areas:\n\n - Compute — the foundation everything runs on: container orchestration, networking, load balancing, edge infrastructure, and the deployment systems that get code from engineers' laptops to production reliably and at scale\n\n - Storage — databases, caching, object storage, and the data infrastructure that underpins everything\n\n - Workflows & Messaging — the systems that power Ramp's financial workflows and event-driven architecture\n\n - Internal Infrastructure — the platform that makes every builder at Ramp faster and more autonomous: observability, cost attribution, and CI/CD systems that give teams visibility into what they build and what it costs\n\n\n\n\nWHAT YOU'LL DO\n\nProduction Engineers at Ramp are full software engineers who happen to specialize in infrastructure. You write production code, you own systems end-to-end, and you drive technical outcomes across the organization — not just within your team.\n\nDay to day, you will:\n\n - Build and operate critical infrastructure across Ramp's compute, storage, messaging, and observability stack — owning the systems that handle real financial transactions at scale.\n\n - Drive architectural change — not just flag problems. When you surface a reliability or scalability issue, you own the path forward: you propose the solution, find the owners across engineering, and stay in until it's resolved.\n\n - Partner with product teams at the design phase — reviewing architectures, embedding golden paths, and making it easy to build correctly the first time.\n\n - Build Ramp's next level of scale — you'll be a hands-on contributor to the most consequential infrastructure shift happening right now: our move to a cellular architecture, enabling Ramp to scale, reach international markets, operate in highly regulated and constrained environments (e.g. FedRAMP), and deliver on enterprise-grade SLAs.\n\n - Enable AI-native engineering — as Ramp builds increasingly AI-powered products, PE is the team that makes sure the platform can support them. You'll proactively partner with product teams on AI infrastructure patterns, define the golden paths that turn one-off solutions into reusable foundations, and stay ahead of emerging challenges before they become blockers.\n\n - Build developer tooling and self-service infrastructure — so that other teams can answer their own questions (cost, performance, reliability) without involving PE.\n\n - Participate in on-call rotation — and more importantly, use every incident as a signal to eliminate the root cause, not just resolve the symptom.\n\n - Lead across the company — PE doesn't just review designs or show up when called. We proactively initiate cross-team architectural reviews, and we take full ownership of company-wide reliability and scalability initiatives: identifying the problem, proposing the solution, aligning the stakeholders, and staying in until it's done.\n\n\n\n\nWHAT WE LOOK FOR\n\nWe don't hire for a checklist. We hire for the instincts that make someone exceptional on this team.\n\nThe mindset we're looking for:\n\n - You can't walk past something broken without wanting to fix it — and yo", "truncated": true, "no_body": false}, {"id": "ashby:f564dcf9-9390-4a3f-896f-8047a5086040", "board": "ashby:ramp", "title": "Software Engineer, Android", "location": "New York, NY (HQ)", "family": "Engineering", "url": "https://jobs.ashbyhq.com/ramp/f564dcf9-9390-4a3f-896f-8047a5086040", "body": "ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\n\n\nABOUT THE ROLE\n\nAs an Android Engineer at Ramp, you’ll enhance our successful and rapidly growing mobile app. You will improve the core platform that thousands of businesses rely on while also building the future of automated finance by integrating AI and intelligent agents into the mobile experience. This is a chance to grow your skills on a proven product and define the next generation of fintech.\n\nCheck out our Engineering Blog https://engineering.ramp.com/ for more on our tech stack, mission and values!\n\n\n\n\nWHAT YOU’LL DO\n\n - Design, build, and launch new products to Ramp’s Android app\n\n - Help establish engineering processes, tools, and systems that allow us to scale the code base and productivity\n\n - Conduct code reviews and set engineering standards\n\n - Work with Product and Design to identify key features that will make the app successful\n\n - Work alongside Product and other cross-functional teams to understand customer feedback and continuously improve our product\n   \n   \n\n\nWHAT YOU NEED\n\n - Minimum 1 year of experience in mobile development\n\n - Proficiency in Kotlin and Compose for Android development\n\n - Experience launching at least one mobile app and/or several features that reached a large number of users\n\n - Desire to work in a fast-paced environment, continuously grow, and master your craft\n\n - Strong understanding of mobile design patterns and best practices\n\n\n\n\nNICE TO HAVES\n\n - Experience with web apps (React, TypeScript)\n\n - Experience with backend technologies (Python, Flask, SQL, OpenAPI)\n\n - Experience with our mobile stack in addition to Kotlin and Compose: MVVM, coroutines, flows, gradle, OpenAPI & Buildkite\n\n - Experience managing apps in the Google Play Console\n\n\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\n\n\nUNITED STATES\n\n - 100% medical, dental & vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n   \n   \n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n \n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n \n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n \n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice", "truncated": false, "no_body": false}, {"id": "lever:19c12e29-b6d4-4d97-9053-48238fb7c381", "board": "lever:spotify", "title": "Machine Learning Engineer - Subscriptions", "location": "London", "family": "Subscriptions R&D", "url": "https://jobs.lever.co/spotify/19c12e29-b6d4-4d97-9053-48238fb7c381", "body": "At Spotify, our Subscriptions Mission focuses on creating experiences that help listeners discover the value of Spotify, become subscribers, and stay with us for the long term. By combining technology, experimentation, and a deep understanding of our users, we help connect artists and fans while building a sustainable subscription business.\nWithin the Subscriptions Mission, the Subs Foundational Models Product Area is part of the Subs User Understanding Studio. We build scalable machine learning solutions that personalize the subscriber journey, from conversion through to long-term retention. Working closely with teams across the mission, we develop ML solutions that improve key business metrics, including subscriber growth, monthly active users, and Premium retention.\nWe're looking for a Machine Learning Engineer to join our Radius squad. You'll take ownership of impactful ML initiatives, develop and improve production models, and contribute to the foundational ML capabilities that power personalization and optimization across Subscriptions.\nYour work could include reducing friction for Free users while balancing retention and conversion, improving payment experiences to reduce Premium churn, or developing reusable models such as subscriber embeddings that support multiple products and use cases.\n\nSpotify is an equal opportunity employer. You are welcome at Spotify for who you are, no matter where you come from, what you look like, or what’s playing in your headphones. Our platform is for everyone, and so is our workplace. The more voices we have represented and amplified in our business, the more we will all thrive, contribute, and be forward-thinking! So bring us your personal experience, your perspectives, and your background. It’s in our differences that we will find the power to keep revolutionizing the way the world listens.\n \nAt Spotify, we are passionate about inclusivity and making sure our entire recruitment process is accessible to everyone. We have ways to request reasonable accommodations during the interview process and help assist in what you need. If you need accommodations at any stage of the application or interview process, please let us know - we’re here to support you in any way we can.\n\nWhat You'll Do\nLead multi-week ML initiatives end to end, from translating business requirements into technical specifications to shipping models and measuring their impact on subscriber metrics \n Own components of our ML systems, making independent technical trade-offs and keeping them observable, reliable, and well documented \n Collaborate with a multi-functional agile team spanning user research, design, data science, product management, and engineering to build new product features that advance our mission to connect artists and fans in personalised and relevant ways \n Prototype new approaches and productionise solutions at scale for our hundreds of millions of active users \n Help drive optimisation, testing, and tooling to improve quality \n Unblock and share context with your teammates to raise the whole squad's velocity \n Use AI-assisted engineering to move faster and remove repetitive toil, while owning the quality of everything you ship \n Partner closely with senior and staff ML engineers, and be part of an active group of machine learning practitioners in your mission and across Spotify\n\nWho You Are\nYou have experience building and shipping production ML systems \n You have a strong background in machine learning, theory, and practice \n You are comfortable explaining the intuition and assumptions behind ML concepts \n You can own well-scoped ML projects end to end and make sound technical decisions independently \n You communicate clearly with stakeholders and can explain the reasoning behind your technical choices \n You are curious, open to feedback, and keen to grow your scope over time \n You have hands-on experience implementing and maintaining production ML systems in Python, Scala, or similar languages, including model development with PyTorch \n You are experienced with building data pipelines, and you are self-sufficient in getting the data you need to build and evaluate your models \n You preferably have experience with cloud platforms like GCP or AWS \n You care about agile software processes, data development, reliability, and focused experimentation \n You have a desire to drive business impact\n\nWhere You'll Be\nWe offer you the flexibility to work where you work best! For this role, you can be within the EMEA region as long as we have a work location \n \n \n This team operates within the Central European and GMT time zone for collaboration.", "truncated": false, "no_body": false}, {"id": "greenhouse:8011428", "board": "greenhouse:reddit", "title": "Staff Backend Engineer, Moderation Enforcement", "location": "Remote - United States", "family": "Software Engineering", "url": "https://job-boards.greenhouse.io/reddit/jobs/8011428", "body": "", "truncated": false, "no_body": true}, {"id": "greenhouse:8143702", "board": "greenhouse:reddit", "title": "Senior Growth Manager (Contract)", "location": "Remote - United Kingdom", "family": null, "url": "https://job-boards.greenhouse.io/reddit/jobs/8143702", "body": "", "truncated": false, "no_body": true}, {"id": "greenhouse:8372525", "board": "greenhouse:reddit", "title": "Senior Manager, Mid-Market Sales (Signature Goods)", "location": "San Francisco, CA", "family": "Client Partner", "url": "https://job-boards.greenhouse.io/reddit/jobs/8372525", "body": "", "truncated": false, "no_body": true}];
const KEY = "js3-audit-labels-v1";
let labels = {};
try { labels = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { labels = {}; }

const QUESTION = "这条职位,你希望它出现在你的候选名单里吗?";

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch (e) {}
  const n = Object.keys(labels).length;
  document.getElementById("bar").style.width = (100 * n / DATA.length) + "%";
  document.getElementById("count").textContent = n + " / " + DATA.length + " 已标注";
}

function card(item, i) {
  const el = document.createElement("div");
  el.className = "card";
  const fam = item.family === null ? "(无)" : item.family;
  const bodyHtml = item.no_body
    ? '<div class="nobody">这个板块没有返回职位正文。只有标题、地点和部门可以依据——过滤器看到的也只有这些。</div>'
    : '<div class="body"></div>';
  el.innerHTML =
      '<div class="ttl"></div>'
    + '<div class="meta"></div>'
    + bodyHtml
    + '<div class="btns">'
    + '<button data-v="yes">想看 (yes)</button>'
    + '<button data-v="no">不想看 (no)</button>'
    + '<button data-v="unsure">说不准 (unsure)</button>'
    + '</div>';
  el.querySelector(".ttl").textContent = (i + 1) + ". " + item.title;
  el.querySelector(".meta").textContent =
    item.board + "  ·  " + item.location + "  ·  部门: " + fam;
  if (!item.no_body) {
    el.querySelector(".body").textContent =
      item.body + (item.truncated ? "\n\n[... 正文已截断 ...]" : "");
  }
  el.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      labels[item.id] = b.dataset.v;
      el.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      el.classList.add("done");
      save();
    };
    if (labels[item.id] === b.dataset.v) { b.classList.add("sel"); el.classList.add("done"); }
  });
  return el;
}

const list = document.getElementById("list");
const q = document.createElement("div");
q.className = "sub";
q.style.margin = "16px 0 0";
q.textContent = QUESTION + "  —  按你自己的标准判断,不用猜过滤器会怎么判。";
list.appendChild(q);
DATA.forEach((item, i) => list.appendChild(card(item, i)));
save();

document.getElementById("dl").onclick = () => {
  const out = {
    labelled_by: "Weiting Wang",
    labelled_on: new Date().toISOString(),
    form: "audit/audit-form.html",
    seed: 20261123,
    blind: "The form showed no score, no bucket and no gate. Order shuffled.",
    question: QUESTION,
    labels: labels
  };
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "labels-weiting.json";
  a.click();
};
</script>
