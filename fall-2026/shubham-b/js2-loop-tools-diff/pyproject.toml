[project]
name = "job-search-agent"
version = "0.1.0"
description = "Discovery-only job-search agent: one Greenhouse board, a deterministic rule, and a separate Claude opinion."
readme = { text = "Job-Search Agent for INFO 7375 (fictional persona Kiran Joshi, Stripe on Greenhouse).", content-type = "text/plain" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
]

[project.scripts]
jsa = "job_search_agent.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_search_agent"]

[tool.uv]
default-groups = ["dev"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D", "ANN", "S", "SIM"]
# D107: __init__ arguments are documented in the class docstring (Google style).
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["job_search_agent"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "subprocess: allowed to start child processes (the autouse no-subprocess guard is lifted)",
]
