<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-claude-code-and-diff-review-fig-01-title 06-claude-code-and-diff-review-fig-01-desc"><title id="06-claude-code-and-diff-review-fig-01-title">A second input separates two passing patches</title><desc id="06-claude-code-and-diff-review-fig-01-desc">A second input separates two passing patches. input 5 rejects the constant patch that input 2 cannot distinguish.</desc><rect width="700" height="420" fill="#FFFFFF"/><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a1a0e"/></marker></defs><text x="32" y="44" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="20" fill="#2a1a0e">A second input separates two passing patches</text><rect x="48" y="92" width="250" height="48" fill="#F5F5F5" stroke="#C8102E" stroke-width="2"/><text x="60" y="121" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">implementation</text><rect x="318" y="92" width="140" height="48" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/><text x="388" y="121" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">x = 2</text><rect x="474" y="92" width="140" height="48" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/><text x="544" y="121" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">x = 5</text><rect x="48" y="148" width="250" height="48" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><text x="60" y="177" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">old x − 1</text><rect x="318" y="148" width="140" height="48" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><text x="388" y="177" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">1</text><rect x="474" y="148" width="140" height="48" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><text x="544" y="177" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">4</text><rect x="48" y="204" width="250" height="48" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><text x="60" y="233" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">constant 3</text><rect x="318" y="204" width="140" height="48" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><text x="388" y="233" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">3 passes</text><rect x="474" y="204" width="140" height="48" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><text x="544" y="233" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">3 fails</text><rect x="48" y="260" width="250" height="48" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><text x="60" y="289" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">intended x + 1</text><rect x="318" y="260" width="140" height="48" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><text x="388" y="289" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">3 passes</text><rect x="474" y="260" width="140" height="48" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><text x="544" y="289" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#