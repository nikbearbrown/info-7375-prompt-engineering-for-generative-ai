<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-randomness-and-first-prompts-fig-01-title 01-randomness-and-first-prompts-fig-01-desc"><title id="01-randomness-and-first-prompts-fig-01-title">A chatbot is one prediction, run in a loop</title><desc id="01-randomness-and-first-prompts-fig-01-desc">A chatbot is one prediction, run in a loop. The transcript goes into the model, the model returns a probability for every possible next token, one token is sampled and appended, and the same question is asked again.</desc><rect width="700" height="420" fill="#FFFFFF"/><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a1a0e"/></marker><marker id="arrowred" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#C8102E"/></marker></defs><text x="32" y="44" text-anchor="start" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="20" font-weight="400" fill="#2a1a0e">A chatbot is one prediction, run in a loop</text><text x="32" y="74" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">one loop, run until a stop token</text><rect x="32" y="92" width="178" height="96" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1.5"/><text x="44" y="114" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="600" fill="#787878">TRANSCRIPT SO FAR</text><text x="44" y="136" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">User: what is a prime?</text><text x="44" y="154" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">Assistant: A prime</text><text x="44" y="174" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">(everything is one string)</text><path d="M 214 140 L 268 140" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="272" y="104" width="118" height="72" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/><text x="331" y="134" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#C8102E">MODEL</text><text x="331" y="154" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">one function</text><path d="M 394 140 L 448 140" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="452" y="92" width="216" height="96" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1.5"/><text x="464" y="114" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="600" fill="#787878">PROBABILITY FOR EVERY TOKEN</text><rect x="516" y="122" width="150" height="10" fill="#C8102E"/><text x="512" y="130" text-anchor="end" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" fill="#2a1a0e">number</text><rect x="516" y="137" width="74" height="10" fill="#787878"/><text x="512" y="145" text-anchor="end" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" fill="#2a1a0e">integer</text><rect x="516" y="152" width="40" height="10" fill="#ADADAD"/><text x="512" y="160" text-anchor="end" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" fill="#2a1a0e">whole</text><rect x="516" y="167" width="14" height="10" fill="#D4D4D4"/><text x="512" y="175" text-anchor="end" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" fill="#2a1a0e">…</text><path d="M 560 196 L 560 232 L 300 232 L 300 250" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="232" y="254" width="136" height="44" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/><text x="300" y="274" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#C8102E">SAMPLE ONE</text><text x="300" y="290" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" fill="#787878">chapter part 2</text><path d="M 232 276 L 121 276 L 121 194" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="129" y="224" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#2a1a0e">append it to the transcript,</text><text x="129" y="240" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#2a1a0e">then ask the same question again</text><text x="32" y="330" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">The model answers one question: what comes next? Everything else is the loop around it.</text><text x="32" y="350" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#C8102E">Nothing in this diagram consults a source or an answer key.</text><path d="M 32 372 H 668" stroke="#C8860E" stroke-width="2"/><text x="350" y="398" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#545454">one question, asked over and over; no step checks the world</text></svg>