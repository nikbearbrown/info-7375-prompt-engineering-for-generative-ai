<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-randomness-and-first-prompts-fig-02-title 01-randomness-and-first-prompts-fig-02-desc"><title id="01-randomness-and-first-prompts-fig-02-title">One step: context in, a ranking over strings out</title><desc id="01-randomness-and-first-prompts-fig-02-desc">One step: context in, a ranking over strings out. A context string enters the model and a probability is returned for every token in the vocabulary. The ordering describes the training corpus, not the world.</desc><rect width="700" height="420" fill="#FFFFFF"/><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a1a0e"/></marker><marker id="arrowred" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#C8102E"/></marker></defs><text x="32" y="44" text-anchor="start" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="20" font-weight="400" fill="#2a1a0e">One step: context in, a ranking over strings out</text><text x="32" y="74" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">context in</text><rect x="32" y="88" width="246" height="40" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/><text x="44" y="113" text-anchor="start" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" font-weight="400" fill="#2a1a0e">The capital of France is</text><path d="M 150 132 L 150 164" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="32" y="168" width="246" height="52" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/><text x="155" y="190" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#C8102E">MODEL</text><text x="155" y="208" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">fixed parameters, deterministic</text><text x="32" y="252" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">ranking out</text><text x="32" y="272" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">A score for every token in the vocabulary,</text><text x="32" y="290" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">normalized so the scores sum to one.</text><text x="32" y="314" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#C8102E">Ordering is a claim about the corpus</text><text x="32" y="332" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#C8102E">the model was fit to — not about France.</text><text x="390" y="74" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">the distribution over next tokens</text><rect x="390" y="88" width="278" height="244" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/><text x="462" y="128" text-anchor="end" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">Paris</text><rect x="472" y="115" width="129.6" height="16" fill="#C8102E"/><text x="607.6" y="128" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">0.81</text><text x="462" y="162" text-anchor="end" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">located</text><rect x="472" y="149" width="9.6" height="16" fill="#787878"/><text x="487.6" y="162" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">0.06</text><text x="462" y="196" text-anchor="end" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">a</text><rect x="472" y="183" width="8.0" height="16" fill="#787878"/><text x="486.0" y="196" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">0.05</text><text x="462" y="230" text-anchor="end" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">the</text><rect x="472" y="217" width="4.8" height="16" fill="#ADADAD"/><text x="482.8" y="230" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">0.03</text><text x="462" y="264" text-anchor="end" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">Lyon</text><rect x="472" y="251" width="3.0" height="16" fill="#ADADAD"/><text x="481" y="264" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">0.01</text><text x="462" y="298" text-anchor="end" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">…</text><rect x="472" y="285" width="6.4" height="16" fill="#D4D4D4"/><text x="484.4" y="298" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">0.04</text><text x="390" y="350" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">constructed illustration; not a recorded model output</text><path d="M 32 372 H 668" stroke="#C8860E" stroke-width="2"/><text x="350" y="398" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#545454">the model ranks continuations; it does not check them</text></svg>