<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-randomness-and-first-prompts-fig-04-title 01-randomness-and-first-prompts-fig-04-desc"><title id="01-randomness-and-first-prompts-fig-04-title">Inside one prediction step</title><desc id="01-randomness-and-first-prompts-fig-04-desc">Inside one prediction step. Tokens become vectors, attention lets them revise each other using context, a feed-forward layer adds stored patterns, the pair repeats across layers, and the final position's vector is turned into one score per vocabulary token and then normalized into a distribution.</desc><rect width="700" height="420" fill="#FFFFFF"/><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a1a0e"/></marker><marker id="arrowred" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#C8102E"/></marker></defs><text x="32" y="44" text-anchor="start" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="20" font-weight="400" fill="#2a1a0e">Inside one prediction step</text><text x="32" y="72" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">1. every token becomes a list of numbers</text><rect x="26" y="84" width="68" height="28" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/><text x="60" y="103" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">The</text><rect x="26" y="120" width="68" height="20" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/><text x="60" y="134" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" fill="#787878">■ ■ ■ ■</text><rect x="114" y="84" width="68" height="28" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/><text x="148" y="103" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">river</text><rect x="114" y="120" width="68" height="20" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/><text x="148" y="134" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" fill="#787878">■ ■ ■ ■</text><rect x="202" y="84" width="68" height="28" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/><text x="236" y="103" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">bank</text><rect x="202" y="120" width="68" height="20" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/><text x="236" y="134" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" fill="#787878">■ ■ ■ ■</text><rect x="290" y="84" width="68" height="28" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/><text x="324" y="103" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">was</text><rect x="290" y="120" width="68" height="20" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/><text x="324" y="134" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" fill="#787878">■ ■ ■ ■</text><text x="32" y="172" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">2. attention lets them read each other</text><path d="M 148 146 Q 192 168 236 146" stroke="#C8102E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 60 146 Q 148 178 236 146" stroke="#787878" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><path d="M 324 146 Q 280 168 236 146" stroke="#787878" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><text x="236" y="200" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="600" fill="#C8102E">“bank” is revised by “river”</text><text x="32" y="232" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">3. a feed-forward layer adds stored patterns</text><rect x="32" y="242" width="336" height="30" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/><text x="200" y="262" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">feed-forward</text><path d="M 376 257 L 376 312 L 200 312 L 200 284" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3"/><text x="32" y="336" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">repeat both operations, layer after layer</text><path d="M 396 62 V 344" stroke="#D4D4D4" stroke-width="1"/><text x="420" y="72" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">4. the last vector becomes the answer</text><rect x="420" y="84" width="248" height="48" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/><text x="544" y="105" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">vector for the final position</text><text x="544" y="122" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">influenced by all the rest</text><path d="M 544 136 L 544 164" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="420" y="168" width="248" height="34" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/><text x="544" y="190" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">one score per vocabulary token</text><path d="M 544 206 L 544 234" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="420" y="238" width="248" height="34" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/><text x="544" y="260" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#C8102E">normalize → a distribution</text><text x="420" y="296" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#C8102E">That last arrow is the transformation</text><text x="420" y="314" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#C8102E">you build by hand in Part 2.</text><text x="32" y="344" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#2a1a0e">Researchers designed these operations; the specific behavior comes from fitted parameters, which is why</text><text x="32" y="360" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#2a1a0e">no one can read off why a particular prediction was made.</text><path d="M 32 372 H 668" stroke="#C8860E" stroke-width="2"/><text x="350" y="398" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#545454">context mixing ends in one score per token, then a normalization</text></svg>