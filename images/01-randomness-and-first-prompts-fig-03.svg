<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-randomness-and-first-prompts-fig-03-title 01-randomness-and-first-prompts-fig-03-desc"><title id="01-randomness-and-first-prompts-fig-03-title">Training moves parameters toward observed text, not toward truth</title><desc id="01-randomness-and-first-prompts-fig-03-desc">Training moves parameters toward observed text, not toward truth. In pretraining the target is the token that actually followed in the corpus. In preference tuning the target is the reply human raters preferred. Neither target is a correctness check.</desc><rect width="700" height="420" fill="#FFFFFF"/><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a1a0e"/></marker><marker id="arrowred" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#C8102E"/></marker></defs><text x="32" y="44" text-anchor="start" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="20" font-weight="400" fill="#2a1a0e">Training moves parameters toward observed text, not toward truth</text><text x="32" y="72" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">STAGE 1 — pretraining: predict the next token in the corpus</text><rect x="32" y="84" width="200" height="62" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/><text x="44" y="106" text-anchor="start" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="12" font-weight="400" fill="#2a1a0e">“the cat sat on the ___”</text><text x="44" y="126" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">hide the last token</text><path d="M 236 115 L 282 115" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="286" y="84" width="108" height="62" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/><text x="340" y="110" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#C8102E">MODEL</text><text x="340" y="128" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">parameters</text><path d="M 398 115 L 444 115" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="448" y="84" width="220" height="62" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/><text x="460" y="106" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#2a1a0e">predicted: floor 0.31 | mat 0.22</text><text x="460" y="126" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="600" fill="#C8102E">actual next token: mat</text><path d="M 558 150 L 558 166 L 340 166 L 340 152" stroke="#C8102E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="344" y="188" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#C8102E">backpropagation nudges every parameter: a little more</text><text x="344" y="202" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#C8102E">weight on the token that actually followed</text><path d="M 32 218 H 668" stroke="#D4D4D4" stroke-width="1"/><text x="32" y="242" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2a1a0e">STAGE 2 — preference tuning: predict what raters preferred</text><rect x="32" y="252" width="196" height="58" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/><text x="44" y="276" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">two candidate replies</text><text x="44" y="294" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">people rank them</text><path d="M 232 281 L 278 281" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="282" y="252" width="112" height="58" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/><text x="338" y="278" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#C8102E">MODEL</text><text x="338" y="294" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#787878">parameters</text><path d="M 398 281 L 444 281" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="448" y="252" width="220" height="58" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/><text x="460" y="276" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#2a1a0e">more likely: replies raters</text><text x="460" y="294" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#2a1a0e">preferred</text><text x="32" y="330" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2a1a0e">Both stages move the same numbers. Neither stage is given an answer key for the world:</text><text x="32" y="350" text-anchor="start" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#C8102E">stage 1 targets the next token in a corpus, stage 2 targets a human preference judgment.</text><path d="M 32 372 H 668" stroke="#C8860E" stroke-width="2"/><text x="350" y="398" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#545454">two different targets; neither one is an answer key</text></svg>